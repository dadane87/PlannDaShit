<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E7C86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Retreat">
<title>Familien-Retreat 17.8.–6.9.</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --tinte:#10303A;
  --wasser:#0E7C86;
  --wasser-tief:#0A5A62;
  --becken:#CFEAEC;
  --becken-hell:#E6F4F5;
  --papier:#F2F7F6;
  --karte:#FFFFFF;
  --sonne:#E8A22B;
  --sonne-hell:#FDF3DF;
  --wiese:#4C7A4E;
  --wiese-hell:#E7F0E5;
  --stein:#7C8F92;
  --linie:#DCE8E8;
  --alarm:#C1553B;
  --alarm-hell:#FBEAE5;
  --schrift-d:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --schrift-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--schrift-b);
  background:var(--papier);
  color:var(--tinte);
  font-size:15px;
  line-height:1.5;
  padding-bottom:calc(70px + var(--safe-b));
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{font-family:var(--schrift-d);margin:0;letter-spacing:-.02em}

/* ── Kopf ─────────────────────────────────────────── */
.kopf{
  background:var(--wasser);
  color:#fff;
  padding:14px 16px 0;
  position:sticky;top:0;z-index:40;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
}
.kopf-zeile{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.kopf h1{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.kopf .spanne{font-size:12px;font-weight:600;opacity:.85;font-family:var(--schrift-d);white-space:nowrap}
.wasserlinie{display:block;width:100%;height:10px;margin-top:8px}

/* ── Bahnen (Tagesleiste) ─────────────────────────── */
.bahnen{
  display:flex;gap:6px;overflow-x:auto;
  padding:10px 16px 12px;
  background:var(--karte);
  border-bottom:1px solid var(--linie);
  position:sticky;top:0;z-index:30;
  scrollbar-width:none;
}
.bahnen::-webkit-scrollbar{display:none}
.bahn{
  flex:0 0 auto;min-width:46px;
  border:1.5px solid var(--linie);
  border-radius:10px;
  background:var(--karte);
  padding:5px 7px 6px;
  text-align:center;cursor:pointer;
  font-family:var(--schrift-d);
  transition:transform .12s ease;
}
.bahn:active{transform:scale(.94)}
.bahn .wd{font-size:10px;font-weight:700;color:var(--stein);text-transform:uppercase;letter-spacing:.06em}
.bahn .dt{font-size:13px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
.bahn .balken{height:3px;border-radius:2px;margin-top:5px;background:var(--linie)}
.bahn[data-t="aktiv"] .balken{background:var(--wiese)}
.bahn[data-t="ruhe"]  .balken{background:var(--wasser)}
.bahn[data-t="besuch"].bahn .balken{background:var(--sonne)}
.bahn[data-t="voll"]  .balken{background:var(--alarm)}
.bahn[data-t="reise"] .balken{background:#7B6BA8}
.bahn[data-t="puffer"] .balken{background:#B6C2C3}
.bahn.aktiv-tag{border-color:var(--tinte);background:var(--becken-hell)}
.bahn.heute{border-color:var(--sonne);border-width:2px}
.bahn.heute .dt::after{content:"•";color:var(--sonne);margin-left:2px}

/* ── Inhalt ───────────────────────────────────────── */
.inhalt{padding:14px 14px 20px;max-width:640px;margin:0 auto}
.tab-inhalt{display:none}
.tab-inhalt.an{display:block}

.karte{
  background:var(--karte);
  border:1px solid var(--linie);
  border-radius:14px;
  margin-bottom:12px;
  overflow:hidden;
}
.karte-kopf{
  padding:12px 14px;
  border-bottom:1px solid var(--linie);
  display:flex;align-items:center;gap:10px;justify-content:space-between;
}
.karte-kopf h2{font-size:15px;font-weight:700}
.karte-koerper{padding:12px 14px}

/* Tageskarte */
.tagkarte{scroll-margin-top:120px}
.tagkarte .datum{display:flex;align-items:baseline;gap:8px}
.tagkarte .datum .gross{font-family:var(--schrift-d);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.tagkarte .datum .wd{font-family:var(--schrift-d);font-size:13px;font-weight:700;color:var(--stein);text-transform:uppercase;letter-spacing:.06em}
.woche-band{
  font-family:var(--schrift-d);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;
  color:var(--wasser-tief);background:var(--becken-hell);
  padding:7px 14px;border-radius:8px;margin:18px 0 10px;
}
.plakette{
  font-family:var(--schrift-d);font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;
  padding:4px 9px;border-radius:20px;white-space:nowrap;
}
.p-aktiv {background:var(--wiese-hell);color:var(--wiese)}
.p-ruhe  {background:var(--becken);color:var(--wasser-tief)}
.p-besuch{background:var(--sonne-hell);color:#9A6A12}
.p-voll  {background:var(--alarm-hell);color:var(--alarm)}
.p-reise {background:#EEEAF6;color:#5C4B8A}
.p-puffer{background:#ECEFEF;color:#6B7A7C}

/* ── Kalenderblatt ───────────────────────────────── */
.blatt-werkzeug{
  display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;
}
.blatt-rolle{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
#kalenderblatt{
  width:1180px;background:#fff;padding:16px 18px 14px;
  border:1px solid var(--linie);border-radius:12px;
}
.kb-kopf{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:2px solid var(--wasser);padding-bottom:7px;margin-bottom:12px}
.kb-kopf h2{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.kb-kopf .sp{font-family:var(--schrift-d);font-size:13px;font-weight:700;color:var(--wasser)}
.kb-tab{width:100%;border-collapse:collapse;table-layout:fixed}
.kb-tab th{
  font-family:var(--schrift-d);font-size:10px;font-weight:800;
  text-transform:uppercase;letter-spacing:.12em;color:var(--stein);
  padding:0 0 5px;text-align:left;border-bottom:1px solid var(--linie);
}
.kb-tab th.kb-rand{width:96px}
.kb-tab td{
  vertical-align:top;padding:0;border:1px solid var(--linie);
  width:154px;height:176px;
}
.kb-tab td.kb-rand{
  border:none;padding:8px 9px 0 0;width:96px;background:none;height:auto;
}
.kb-rand .rg{font-family:var(--schrift-d);font-size:12px;font-weight:800;line-height:1.25}
.kb-rand .ph{font-size:10px;color:var(--wasser);font-weight:600;margin-top:2px;line-height:1.3}
.kb-luft td{border:none;height:7px;padding:0}

.kb-zelle{height:100%;display:flex;flex-direction:column;overflow:hidden}
.kb-band{height:4px;flex:0 0 auto}
.kb-t-aktiv .kb-band{background:var(--wiese)}
.kb-t-ruhe  .kb-band{background:var(--wasser)}
.kb-t-besuch .kb-band{background:var(--sonne)}
.kb-t-voll  .kb-band{background:var(--alarm)}
.kb-t-reise .kb-band{background:#7B6BA8}
.kb-t-puffer .kb-band{background:#B6C2C3}
.kb-t-puffer .kb-inhalt{background:#FAFBFB}
.kb-inhalt{padding:6px 8px 7px;flex:1;min-height:0;overflow:hidden}
.kb-datum{display:flex;align-items:baseline;margin-bottom:1px}
.kb-datum .n{margin-right:5px}
.kb-datum .n{font-family:var(--schrift-d);font-size:17px;font-weight:800;line-height:1}
.kb-datum .m{font-family:var(--schrift-d);font-size:9px;font-weight:700;color:var(--stein)}
.kb-typ{font-family:var(--schrift-d);font-size:8.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;color:var(--stein);margin-bottom:5px}
.kb-fix{display:flex;font-size:9.5px;line-height:1.3;margin-bottom:2px}
.kb-fix b{margin-right:5px}
.kb-fix b{font-family:var(--schrift-d);color:var(--wasser);white-space:nowrap;font-weight:700}
.kb-abschnitt{margin-top:5px;padding-top:4px;border-top:1px dotted var(--linie);
  font-size:9.5px;line-height:1.35}
.kb-marke{font-family:var(--schrift-d);font-size:7.5px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:1px}
.kb-eltern .kb-marke{color:#B07C1A}
.kb-eltern{color:#8A6314}
.kb-haus .kb-marke{color:var(--stein)}
.kb-haus{color:#5F6E70}
.kb-fuss{display:flex;justify-content:space-between;gap:16px;margin-top:11px;
  padding-top:8px;border-top:1px solid var(--linie);font-size:9.5px;line-height:1.45}
.kb-leg{display:flex;flex-wrap:wrap;align-items:center}
.kb-leg span{margin:0 12px 3px 0}
.kb-leg span{display:flex;align-items:center;white-space:nowrap;
  font-family:var(--schrift-d);font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;color:var(--stein)}
.kb-leg i{width:13px;height:4px;border-radius:2px;display:inline-block;margin-right:5px}
.kb-notizen{flex:1;max-width:560px;color:var(--tinte)}
.kb-notizen b{font-family:var(--schrift-d)}

@media print{
  .kopf,.bahnen,.fuss,.blatt-werkzeug,.toast,.hinterlegung{display:none!important}
  body{padding:0;background:#fff;font-size:10px}
  .inhalt{padding:0;max-width:none}
  .tab-inhalt{display:none!important}
  .tab-inhalt.an{display:block!important}
  .blatt-rolle{overflow:visible}
  #kalenderblatt{width:100%;border:none;border-radius:0;padding:0}
  .kb-tab td{height:auto;min-height:150px}
  .kb-zelle{min-height:150px}
  @page{size:A4 landscape;margin:9mm}
}

/* Feld */
.feld{margin-bottom:12px}
.feld:last-child{margin-bottom:0}
.feld-titel{
  font-family:var(--schrift-d);font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.09em;color:var(--stein);
  margin-bottom:4px;display:flex;align-items:center;gap:5px;
}
.feld-wert{
  padding:8px 10px;border-radius:9px;background:var(--papier);
  border:1px dashed transparent;cursor:pointer;min-height:20px;
  white-space:pre-wrap;word-break:break-word;
}
.feld-wert:hover,.feld-wert:focus-visible{border-color:var(--becken)}
.feld-wert.leer{color:var(--stein);font-style:italic}
.feld.eltern .feld-wert{background:var(--sonne-hell)}
.feld.eltern .feld-titel{color:#9A6A12}
.feld.notiz .feld-wert{background:var(--alarm-hell);color:#8A3A26}
.feld.notiz .feld-titel{color:var(--alarm)}

/* Fixtermine */
.fix-liste{list-style:none;margin:0;padding:0}
.fix{
  display:flex;gap:9px;align-items:flex-start;
  padding:8px 10px;border-radius:9px;
  background:var(--becken-hell);
  border-left:3px solid var(--wasser);
  margin-bottom:6px;
}
.fix .zeit{
  font-family:var(--schrift-d);font-weight:700;font-size:12px;
  color:var(--wasser-tief);white-space:nowrap;flex:0 0 auto;
  padding-top:1px;font-variant-numeric:tabular-nums;
}
.fix .txt{flex:1;min-width:0}
.fix .txt .t{font-weight:600;font-size:14px}
.fix .txt .n{font-size:12px;color:var(--stein);margin-top:1px}
.fix .weg{
  flex:0 0 auto;background:none;border:none;color:var(--stein);
  font-size:17px;line-height:1;padding:2px 4px;cursor:pointer;
}

/* Optionen */
.opt{
  display:flex;gap:9px;align-items:flex-start;
  padding:9px 11px;border-radius:10px;
  border:1.5px solid var(--linie);background:var(--karte);
  margin-bottom:6px;cursor:pointer;
}
.opt .mark{
  flex:0 0 auto;width:19px;height:19px;border-radius:50%;
  border:2px solid var(--linie);margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#fff;font-weight:700;
}
.opt .lbl{
  font-family:var(--schrift-d);font-size:10.5px;font-weight:700;
  letter-spacing:.08em;color:var(--stein);text-transform:uppercase;
}
.opt.gewaehlt{border-color:var(--wiese);background:var(--wiese-hell)}
.opt.gewaehlt .mark{background:var(--wiese);border-color:var(--wiese)}
.opt.gewaehlt .lbl{color:var(--wiese)}
.opt-txt{flex:1;min-width:0}

/* Haken-Listen */
.hakenliste{list-style:none;margin:0;padding:0}
.haken{
  display:flex;gap:10px;align-items:flex-start;
  padding:9px 4px;border-bottom:1px solid var(--linie);
}
.haken:last-child{border-bottom:none}
.haken .box{
  flex:0 0 auto;width:21px;height:21px;border-radius:6px;
  border:2px solid var(--becken);background:var(--karte);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:#fff;margin-top:1px;
}
.haken.fertig .box{background:var(--wasser);border-color:var(--wasser)}
.haken.fertig .haken-txt{text-decoration:line-through;color:var(--stein)}
.haken-txt{flex:1;min-width:0;cursor:pointer;word-break:break-word}
.haken .weg{
  flex:0 0 auto;background:none;border:none;color:var(--stein);
  font-size:17px;line-height:1;padding:0 4px;cursor:pointer;
}

/* Ideen */
.idee{padding:9px 4px;border-bottom:1px solid var(--linie);display:flex;gap:8px}
.idee:last-child{border-bottom:none}
.idee-txt{flex:1;min-width:0}
.idee .nm{font-weight:600;cursor:pointer}
.idee .dt{font-size:13px;color:var(--stein);margin-top:1px;cursor:pointer;word-break:break-word}

/* Rhythmus */
.rhy{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid var(--linie)}
.rhy:last-child{border-bottom:none}
.rhy .z{
  font-family:var(--schrift-d);font-weight:700;font-size:12px;
  color:var(--wasser-tief);flex:0 0 84px;padding-top:2px;
  font-variant-numeric:tabular-nums;
}
.rhy .k{flex:1;min-width:0}
.rhy.stern{background:var(--sonne-hell);border-radius:9px;padding:10px;border-bottom:none;margin:4px 0}
.rhy .e{font-size:12.5px;color:#9A6A12;font-weight:600;margin-top:3px}

/* Knöpfe */
.knopf{
  font-family:var(--schrift-d);font-weight:700;font-size:13px;
  border-radius:9px;border:1.5px solid var(--linie);
  background:var(--karte);color:var(--tinte);
  padding:9px 13px;cursor:pointer;
}
.knopf.voll{background:var(--wasser);border-color:var(--wasser);color:#fff}
.knopf.klein{font-size:12px;padding:6px 10px}
.knopf.gefahr{color:var(--alarm);border-color:var(--alarm-hell)}
.knopf-reihe{display:flex;gap:8px;flex-wrap:wrap}
.plus{
  width:100%;margin-top:8px;background:var(--becken-hell);
  border:1.5px dashed var(--becken);color:var(--wasser-tief);
}

/* Editor */
.hinterlegung{
  position:fixed;inset:0;background:rgba(16,48,58,.55);
  z-index:90;display:flex;align-items:flex-end;
}
.hinterlegung[hidden]{display:none}
.blatt{
  background:var(--karte);width:100%;
  border-radius:18px 18px 0 0;padding:16px 16px calc(16px + var(--safe-b));
  max-height:86vh;overflow-y:auto;
}
.blatt h3{font-size:15px;margin-bottom:10px}
.blatt textarea,.blatt input{
  width:100%;font-family:var(--schrift-b);font-size:16px;
  border:1.5px solid var(--becken);border-radius:10px;
  padding:10px;background:var(--papier);color:var(--tinte);
  resize:vertical;margin-bottom:10px;
}
.blatt textarea:focus,.blatt input:focus{outline:2px solid var(--wasser);border-color:var(--wasser)}
.blatt label{
  font-family:var(--schrift-d);font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:var(--stein);
  display:block;margin-bottom:4px;
}

/* Fußleiste */
.fuss{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--karte);border-top:1px solid var(--linie);
  display:flex;padding-bottom:var(--safe-b);
}
.fuss button{
  flex:1;background:none;border:none;padding:9px 2px 10px;
  font-family:var(--schrift-d);font-size:10px;font-weight:700;
  letter-spacing:.04em;color:var(--stein);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
.fuss button .ic{font-size:18px;line-height:1}
.fuss button.an{color:var(--wasser)}

.hinweis{
  background:var(--sonne-hell);border-left:3px solid var(--sonne);
  border-radius:0 10px 10px 0;padding:11px 13px;font-size:13.5px;
  margin-bottom:12px;
}
.hinweis.warn{background:var(--alarm-hell);border-color:var(--alarm)}
.hinweis strong{font-family:var(--schrift-d)}
.mini{font-size:12px;color:var(--stein);margin-top:6px}
.toast{
  position:fixed;bottom:calc(80px + var(--safe-b));left:50%;
  transform:translateX(-50%);background:var(--tinte);color:#fff;
  padding:10px 18px;border-radius:22px;font-size:13.5px;font-weight:500;
  z-index:95;opacity:0;transition:opacity .2s;pointer-events:none;
  max-width:88vw;text-align:center;
}
.toast.zeig{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="kopf">
  <div class="kopf-zeile">
    <h1>Familien-Retreat</h1>
    <span class="spanne">17.8. – 6.9.</span>
  </div>
  <svg class="wasserlinie" viewBox="0 0 400 10" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 6 Q 25 1 50 6 T 100 6 T 150 6 T 200 6 T 250 6 T 300 6 T 350 6 T 400 6"
          fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2"/>
  </svg>
</header>

<nav class="bahnen" id="bahnen" aria-label="Tage"></nav>

<main class="inhalt">
  <section class="tab-inhalt an" id="tab-plan"></section>
  <section class="tab-inhalt" id="tab-einkauf"></section>
  <section class="tab-inhalt" id="tab-blatt"></section>
  <section class="tab-inhalt" id="tab-ideen"></section>
  <section class="tab-inhalt" id="tab-listen"></section>
  <section class="tab-inhalt" id="tab-info"></section>
</main>

<nav class="fuss" id="fuss">
  <button data-tab="plan" class="an"><span class="ic">🗓</span>Plan</button>
  <button data-tab="einkauf"><span class="ic">🛒</span>Einkauf</button>
  <button data-tab="blatt"><span class="ic">▦</span>Blatt</button>
  <button data-tab="ideen"><span class="ic">🧸</span>Ideen</button>
  <button data-tab="listen"><span class="ic">✓</span>Listen</button>
  <button data-tab="info"><span class="ic">⋯</span>Mehr</button>
</nav>

<div class="hinterlegung" id="editor" hidden>
  <div class="blatt">
    <h3 id="ed-titel">Bearbeiten</h3>
    <div id="ed-felder"></div>
    <div class="knopf-reihe">
      <button class="knopf voll" id="ed-speichern" style="flex:1">Speichern</button>
      <button class="knopf" id="ed-abbrechen">Abbrechen</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══ Speicher (fällt auf Arbeitsspeicher zurück, falls blockiert) ══ */
const Speicher=(()=>{
  let ok=true,ersatz={};
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){ok=false}
  return{
    lies(k){try{return ok?localStorage.getItem(k):(ersatz[k]??null)}catch(e){return ersatz[k]??null}},
    schreib(k,v){try{ok?localStorage.setItem(k,v):ersatz[k]=v}catch(e){ersatz[k]=v}},
    dauerhaft:ok
  };
})();
</script>











<script>
/* ══ Ausgangsdaten ══ */
const START = {
  version: 4,
  tage: [

/* ══ Zustand ══ */
const SCHLUESSEL='retreat-2026';
let D, aktiverTag=0, aktiverTab='plan';

function tiefKopie(o){return JSON.parse(JSON.stringify(o))}

function laden(){
  const roh=Speicher.lies(SCHLUESSEL);
  if(!roh){D=tiefKopie(START);return}
  try{
    const g=JSON.parse(roh);
    D = (g.version===START.version) ? g : verschmelzen(g);
  }catch(e){D=tiefKopie(START)}
}

/* Bei neuer Datenversion: eigene Änderungen retten, neue Felder ergänzen */
function verschmelzen(alt){
  const neu=tiefKopie(START);
  if(Array.isArray(alt.tage)) alt.tage.forEach(at=>{
    const nt=neu.tage.find(t=>t.id===at.id);
    if(nt && at.gewaehlt!=null) nt.gewaehlt=at.gewaehlt;
  });
  ['einkauf','listen'].forEach(feld=>{
    if(!Array.isArray(alt[feld]))return;
    alt[feld].forEach(ag=>{
      const ng=neu[feld].find(g=>g.id===ag.id);
      if(!ng||!Array.isArray(ag.posten))return;
      ag.posten.forEach(ap=>{
        const np=ng.posten.find(p=>p.id===ap.id);
        if(np&&ap.ok) np.ok=true;
      });
    });
  });
  return neu;
}

function sichern(){
  Speicher.schreib(SCHLUESSEL,JSON.stringify(D));
}
function neueId(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function melde(txt){
  const t=document.getElementById('toast');
  t.textContent=txt;t.classList.add('zeig');
  clearTimeout(t._z);t._z=setTimeout(()=>t.classList.remove('zeig'),1900);
}

let edSpeichern=null;
function bearbeite(titel,felder,beiSpeichern){
  const box=document.getElementById('editor');
  document.getElementById('ed-titel').textContent=titel;
  const ziel=document.getElementById('ed-felder');
  ziel.innerHTML=felder.map((f,i)=>
    `<label for="edf${i}">${esc(f.label)}</label>`+
    (f.zeilen===1
      ? `<input id="edf${i}" type="text" value="${esc(f.wert)}">`
      : `<textarea id="edf${i}" rows="${f.zeilen||4}">${esc(f.wert)}</textarea>`)
  ).join('');
  edSpeichern=()=>{
    const werte=felder.map((f,i)=>document.getElementById('edf'+i).value);
    beiSpeichern(werte);sichern();zeichne();
  };
  box.hidden=false;
  setTimeout(()=>{const e=document.getElementById('edf0');if(e){e.focus();
    if(e.setSelectionRange){const l=e.value.length;e.setSelectionRange(l,l)}}},60);
}
function editorZu(){document.getElementById('editor').hidden=true;edSpeichern=null}

document.getElementById('ed-speichern').onclick=()=>{if(edSpeichern)edSpeichern();editorZu()};
document.getElementById('ed-abbrechen').onclick=editorZu;
document.getElementById('editor').onclick=e=>{if(e.target.id==='editor')editorZu()};

function zeichnePlan(){
  const t=D.tage[aktiverTag];
  const el=document.getElementById('tab-plan');
  let h='';

  if(t.woche) h+=`<div class="woche-band">${esc(t.woche)}</div>`;

  h+=`<article class="karte tagkarte">
    <div class="karte-kopf">
      <div class="datum">
        <span class="gross">${esc(t.datum)}</span>
        <span class="wd">${esc(t.wd)}</span>
      </div>
      <span class="plakette p-${t.typ}" data-klick="typ:${t.id}">${esc(t.typLabel)}</span>
    </div>
    <div class="karte-koerper">`;

  /* Fixtermine */
  h+=`<div class="feld"><div class="feld-titel">Feste Termine</div>`;
  if(t.fix.length){
    h+=`<ul class="fix-liste">`+t.fix.map(f=>`
      <li class="fix">
        <span class="zeit" data-klick="fix:${t.id}:${f.id}">${esc(f.zeit)}</span>
        <span class="txt" data-klick="fix:${t.id}:${f.id}">
          <span class="t">${esc(f.titel)}</span>
          ${f.notiz?`<span class="n">${esc(f.notiz)}</span>`:''}
        </span>
        <button class="weg" data-klick="fixWeg:${t.id}:${f.id}" aria-label="Termin löschen">×</button>
      </li>`).join('')+`</ul>`;
  }else{
    h+=`<div class="feld-wert leer" style="cursor:default">Keine festen Termine</div>`;
  }
  h+=`<button class="knopf plus" data-klick="fixNeu:${t.id}">+ Termin hinzufügen</button></div>`;

  h+=feld('Programm',t.programm,'',`text:${t.id}:programm:Programm`);

  /* Optionen */
  if(t.optA||t.optB){
    h+=`<div class="feld"><div class="feld-titel">Wahl für den Tag</div>`;
    ['A','B'].forEach(b=>{
      const w=t['opt'+b];if(!w)return;
      const an=t.gewaehlt===b;
      h+=`<div class="opt ${an?'gewaehlt':''}" data-klick="waehle:${t.id}:${b}">
        <span class="mark">${an?'✓':''}</span>
        <span class="opt-txt">
          <span class="lbl">Option ${b}</span><br>${esc(w)}
        </span>
      </div>`;
    });
    h+=`<button class="knopf plus klein" data-klick="optBearb:${t.id}">Optionen bearbeiten</button></div>`;
  }else{
    h+=`<button class="knopf plus klein" data-klick="optBearb:${t.id}">+ Optionen A / B anlegen</button>`;
  }

  h+=feld('Eltern-Moment',t.eltern,'eltern',`text:${t.id}:eltern:Eltern-Moment`);
  h+=feld('Essen',t.essen,'',`text:${t.id}:essen:Essen`);
  h+=feld('Haushalt',t.haushalt,'',`text:${t.id}:haushalt:Haushalt`);
  if(String(t.notiz||'').trim()){
    h+=feld('Achtung',t.notiz,'notiz',`text:${t.id}:notiz:Achtung`);
  }else{
    h+=`<button class="knopf plus klein" data-klick="text:${t.id}:notiz:Achtung">+ Hinweis für diesen Tag</button>`;
  }

  h+=`</div></article>`;

  /* Rhythmus passend zum Tagestyp */
  const art=(t.typ==='aktiv'||t.typ==='besuch')?'aktiv':'ruhe';
  const rl=D.rhythmus[art];
  h+=`<article class="karte">
    <div class="karte-kopf"><h2>Tagesrhythmus · ${art==='aktiv'?'Aktivtag':'Ruhetag'}</h2></div>
    <div class="karte-koerper">`+
    rl.map((r,i)=>`<div class="rhy ${r.stern?'stern':''}">
      <span class="z">${esc(r.z)}</span>
      <span class="k" data-klick="rhy:${art}:${i}">${esc(r.k)}
        ${r.e?`<span class="e">${esc(r.e)}</span>`:''}
      </span>
    </div>`).join('')+
    `</div></article>`;

  el.innerHTML=h;
}

  document.getElementById('bahnen').innerHTML=D.tage.map((t,i)=>
    `<button class="bahn ${i===aktiverTag?'aktiv-tag':''} ${t.iso===heute?'heute':''}"
       data-t="${t.typ}" data-klick="tag:${i}">
      <span class="wd">${esc(t.wd)}</span>
      <span class="dt">${esc(t.datum.replace(/\.$/,''))}</span>
      <span class="balken"></span>
    </button>`).join('');
  if(aktiverTab!=='plan')return;
  const a=document.querySelector('.bahn.aktiv-tag');
  if(a) a.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}

function zeichne(){
  zeichneBahnen();
  ({plan:zeichnePlan,blatt:zeichneBlatt,einkauf:zeichneEinkauf,ideen:zeichneIdeen,
    listen:zeichneListen,info:zeichneInfo})[aktiverTab]();
}

/* ══ Klicks ══ */
function finde(arr,id){return arr.find(x=>x.id===id)}

document.addEventListener('click',e=>{
  const ziel=e.target.closest('[data-klick]');
  if(!ziel)return;
  const [befehl,...a]=ziel.dataset.klick.split(':');
  const tag=id=>finde(D.tage,id);

  switch(befehl){
    case 'tag': aktiverTag=+a[0]; zeichne(); window.scrollTo({top:0,behavior:'smooth'}); break;

    case 'text':{
      const t=tag(a[0]),f=a[1];
      bearbeite(a[2],[{label:a[2],wert:t[f],zeilen:5}],v=>{t[f]=v[0].trim()});
      break;}

    case 'typ':{
      const t=tag(a[0]);
      bearbeite('Tages-Etikett',[{label:'Etikett',wert:t.typLabel,zeilen:1}],v=>{
        t.typLabel=v[0].trim()||t.typLabel});
      break;}

    case 'fix':{
      const t=tag(a[0]),f=finde(t.fix,a[1]);
      bearbeite('Termin bearbeiten',[
        {label:'Uhrzeit',wert:f.zeit,zeilen:1},
        {label:'Termin',wert:f.titel,zeilen:1},
        {label:'Hinweis',wert:f.notiz,zeilen:2}
      ],v=>{f.zeit=v[0].trim();f.titel=v[1].trim();f.notiz=v[2].trim()});
      break;}

    case 'fixNeu':{
      const t=tag(a[0]);
      bearbeite('Neuer Termin',[
        {label:'Uhrzeit',wert:'',zeilen:1},
        {label:'Termin',wert:'',zeilen:1},
        {label:'Hinweis',wert:'',zeilen:2}
      ],v=>{if(v[1].trim())t.fix.push({id:neueId(),zeit:v[0].trim()||'—',titel:v[1].trim(),notiz:v[2].trim()})});
      break;}

    case 'fixWeg':{
      const t=tag(a[0]);
      t.fix=t.fix.filter(f=>f.id!==a[1]);sichern();zeichne();melde('Termin gelöscht');
      break;}

    case 'waehle':{
      const t=tag(a[0]);
      t.gewaehlt = t.gewaehlt===a[1] ? null : a[1];
      sichern();zeichne();
      break;}

    case 'optBearb':{
      const t=tag(a[0]);
      bearbeite('Optionen',[
        {label:'Option A',wert:t.optA,zeilen:3},
        {label:'Option B',wert:t.optB,zeilen:3}
      ],v=>{t.optA=v[0].trim();t.optB=v[1].trim();
            if(!t.optA&&t.gewaehlt==='A')t.gewaehlt=null;
            if(!t.optB&&t.gewaehlt==='B')t.gewaehlt=null});
      break;}

    case 'rhy':{
      const r=D.rhythmus[a[0]][+a[1]];
      bearbeite('Zeitblock',[
        {label:'Uhrzeit',wert:r.z,zeilen:1},
        {label:'Kinder & Familie',wert:r.k,zeilen:3},
        {label:'Eltern-Moment',wert:r.e,zeilen:2}
      ],v=>{r.z=v[0].trim();r.k=v[1].trim();r.e=v[2].trim()});
      break;}

    case 'haken':{
      const g=finde(D[a[0]],a[1]),p=finde(g.posten,a[2]);
      p.ok=!p.ok;sichern();zeichne();
      break;}

    case 'hakenTxt':{
      const g=finde(D[a[0]],a[1]),p=finde(g.posten,a[2]);
      bearbeite('Eintrag',[{label:'Text',wert:p.t,zeilen:2}],v=>{p.t=v[0].trim()||p.t});
      break;}

    case 'hakenWeg':{
      const g=finde(D[a[0]],a[1]);
      g.posten=g.posten.filter(p=>p.id!==a[2]);sichern();zeichne();melde('Gelöscht');
      break;}

    case 'hakenNeu':{
      const g=finde(D[a[0]],a[1]);
      bearbeite('Neuer Eintrag',[{label:'Text',wert:'',zeilen:2}],v=>{
        if(v[0].trim())g.posten.push({id:neueId(),t:v[0].trim(),ok:false})});
      break;}

    case 'grpTitel':{
      const g=finde(D[a[0]],a[1]);
      bearbeite('Überschrift',[{label:'Überschrift',wert:g.titel,zeilen:1}],v=>{g.titel=v[0].trim()||g.titel});
      break;}

    case 'grpWann':{
      const g=finde(D.einkauf,a[0]);
      bearbeite('Zeitpunkt',[{label:'Wann',wert:g.wann,zeilen:2}],v=>{g.wann=v[0].trim()});
      break;}

    case 'grpHinweis':{
      const g=finde(D.einkauf,a[0]);
      bearbeite('Hinweis',[{label:'Hinweis',wert:g.hinweis,zeilen:3}],v=>{g.hinweis=v[0].trim()});
      break;}

    case 'idee':{
      const g=finde(D.ideen,a[0]),p=finde(g.posten,a[1]);
      bearbeite('Idee',[
        {label:'Name',wert:p.nm,zeilen:1},
        {label:'Beschreibung',wert:p.dt,zeilen:3}
      ],v=>{p.nm=v[0].trim()||p.nm;p.dt=v[1].trim()});
      break;}

    case 'ideeNeu':{
      const g=finde(D.ideen,a[0]);
      bearbeite('Neue Idee',[
        {label:'Name',wert:'',zeilen:1},
        {label:'Beschreibung',wert:'',zeilen:3}
      ],v=>{if(v[0].trim())g.posten.push({id:neueId(),nm:v[0].trim(),dt:v[1].trim()})});
      break;}

    case 'ideeWeg':{
      const g=finde(D.ideen,a[0]);
      g.posten=g.posten.filter(p=>p.id!==a[1]);sichern();zeichne();melde('Gelöscht');
      break;}

    case 'ideeKat':{
      const g=finde(D.ideen,a[0]);
      bearbeite('Kategorie',[{label:'Kategorie',wert:g.kat,zeilen:1}],v=>{g.kat=v[0].trim()||g.kat});
      break;}

    case 'merk':{
      const m=finde(D.merken,a[0]);
      bearbeite('Hinweis',[{label:'Text',wert:m.text.replace(/<[^>]+>/g,''),zeilen:4}],v=>{m.text=esc(v[0].trim())});
      break;}

    case 'merkNeu':
      bearbeite('Neuer Hinweis',[{label:'Text',wert:'',zeilen:4}],v=>{
        if(v[0].trim())D.merken.push({id:neueId(),art:'tipp',text:esc(v[0].trim())})});
      break;

    case 'druck': window.print(); break;

    case 'ausBlatt':{
      const i=D.tage.findIndex(t=>t.id===a[0]);
      if(i<0)break;
      aktiverTag=i; aktiverTab='plan';
      document.querySelectorAll('#fuss button').forEach(x=>x.classList.toggle('an',x.dataset.tab==='plan'));
      document.querySelectorAll('.tab-inhalt').forEach(s=>s.classList.toggle('an',s.id==='tab-plan'));
      document.getElementById('bahnen').style.display='';
      zeichne(); window.scrollTo({top:0});
      break;}

    case 'einkaufKopieren':{
      const zeilen=[];
      D.einkauf.forEach(g=>{
        const offen=g.posten.filter(p=>!p.ok);
        if(offen.length){zeilen.push(g.titel+' ('+g.wann+')');
          offen.forEach(p=>zeilen.push('· '+p.t));zeilen.push('')}
      });
      const txt=zeilen.join('\n').trim()||'Alles abgehakt.';
      (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject())
        .then(()=>melde('In die Zwischenablage kopiert'))
        .catch(()=>bearbeite('Offene Posten',[{label:'Zum Kopieren markieren',wert:txt,zeilen:12}],()=>{}));
      break;}

    case 'export':{
      const b=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
      const u=URL.createObjectURL(b),l=document.createElement('a');
      l.href=u;l.download='retreat-stand-'+new Date().toISOString().slice(0,10)+'.json';
      l.click();setTimeout(()=>URL.revokeObjectURL(u),1500);
      melde('Datei exportiert – jetzt teilen');
      break;}

    case 'import': document.getElementById('datei').click(); break;

    case 'reset':
      if(confirm('Wirklich alles auf den Ausgangsplan zurücksetzen? Eure Änderungen gehen verloren.')){
        D=tiefKopie(START);sichern();zeichne();melde('Zurückgesetzt');
      }
      break;
  }
});

/* Datei-Import */
document.addEventListener('change',e=>{
  if(e.target.id!=='datei')return;
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const g=JSON.parse(r.result);
      if(!g.tage||!Array.isArray(g.tage))throw 0;
      D=(g.version===START.version)?g:verschmelzen(g);
      sichern();zeichne();melde('Stand geladen');
    }catch(err){melde('Datei konnte nicht gelesen werden')}
    e.target.value='';
  };
  r.readAsText(f);
});

/* Tastatur */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')editorZu();
});
document.addEventListener('keypress',e=>{
  if(e.key!=='Enter')return;
  const z=e.target.closest('[data-klick]');
  if(z&&z.classList.contains('feld-wert')){e.preventDefault();z.click()}
});

/* Tabs */
document.getElementById('fuss').addEventListener('click',e=>{
  const b=e.target.closest('button[data-tab]');if(!b)return;
  aktiverTab=b.dataset.tab;
  document.querySelectorAll('#fuss button').forEach(x=>x.classList.toggle('an',x===b));
  document.querySelectorAll('.tab-inhalt').forEach(s=>
    s.classList.toggle('an',s.id==='tab-'+aktiverTab));
  document.getElementById('bahnen').style.display = aktiverTab==='plan'?'':'none';
  zeichne();window.scrollTo({top:0});
});

/* ══ Start ══ */
laden();
const heute=new Date().toISOString().slice(0,10);
const i=D.tage.findIndex(t=>t.iso>=heute);
aktiverTag = i>=0 ? i : 0;
zeichne();

</script>
</body>
