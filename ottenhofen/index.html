<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F9F9F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ottenhofen">
<meta name="format-detection" content="telephone=no">
<title>Gemeinde Ottenhofen</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* ── iOS-Systemfarben ────────────────────────────────────────────── */
:root{
  --tint:#C8102E;            /* Ottenhofener Wappenrot */
  --tint-weich:rgba(200,16,46,.12);
  --gold:#E3A400;
  --bg:#F2F2F7;              /* systemGroupedBackground */
  --karte:#FFFFFF;           /* secondarySystemGroupedBackground */
  --karte-2:#F2F2F7;
  --text:#000000;
  --text-2:rgba(60,60,67,.6);
  --text-3:rgba(60,60,67,.3);
  --trenner:rgba(60,60,67,.18);
  --fuellung:rgba(118,118,128,.12);
  --bar:rgba(249,249,249,.82);
  --gruen:#34C759;--blau:#007AFF;--orange:#FF9500;--lila:#AF52DE;--indigo:#5856D6;
  --pink:#FF2D55;--teal:#30B0C7;--grau:#8E8E93;--braun:#A2845E;--mint:#00C7BE;--gelb:#FFCC00;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',system-ui,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --tint:#FF4F5E;--tint-weich:rgba(255,79,94,.16);
    --bg:#000000;--karte:#1C1C1E;--karte-2:#2C2C2E;
    --text:#FFFFFF;--text-2:rgba(235,235,245,.6);--text-3:rgba(235,235,245,.3);
    --trenner:rgba(84,84,88,.55);--fuellung:rgba(118,118,128,.24);
    --bar:rgba(22,22,24,.8);
    --gruen:#30D158;--blau:#0A84FF;--orange:#FF9F0A;--lila:#BF5AF2;--indigo:#5E5CE6;
    --pink:#FF375F;--teal:#40C8E0;--grau:#98989D;--braun:#AC8E68;--mint:#63E6E2;--gelb:#FFD60A;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:17px;line-height:1.35;letter-spacing:-.41px;
  -webkit-text-size-adjust:100%;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
a{color:var(--tint);text-decoration:none}
svg{display:block}

/* ── Gerüst: Tabs mit eigenem Navigationsstapel ─────────────────── */
#app{position:fixed;inset:0;overflow:hidden}
.stapel{position:absolute;inset:0;display:none;overflow:hidden}
.stapel.aktiv{display:block}
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;
  will-change:transform;transition:transform .42s cubic-bezier(.2,.8,.2,1),filter .42s}
.screen.rein{transform:translateX(100%)}
.screen.dahinter{transform:translateX(-28%);filter:brightness(.92)}
.screen.ohne-anim{transition:none}
.screen.schatten{box-shadow:-8px 0 24px rgba(0,0,0,.12)}

/* Navigationsleiste */
.navbar{position:absolute;left:0;right:0;top:0;z-index:5;padding-top:var(--safe-t);
  background:transparent;transition:background .2s,box-shadow .2s}
.navbar.fest{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 .5px 0 var(--trenner)}
.navbar .zeile{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px}
.navtitel{font-weight:600;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:62vw;opacity:0;transition:opacity .18s}
.navbar.fest .navtitel,.navbar.immer .navtitel{opacity:1}
.zurueck{display:flex;align-items:center;gap:2px;color:var(--tint);font-size:17px;height:44px;padding-right:8px;
  max-width:36vw;white-space:nowrap;overflow:hidden;justify-self:start}
.zurueck span{overflow:hidden;text-overflow:ellipsis}
.zurueck svg{flex:0 0 auto;width:13px;height:21px;margin:0 4px 0 2px}
.rechts{justify-self:end;display:flex;gap:4px}
.knopf-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--tint)}
.knopf-icon svg{width:22px;height:22px}

.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding-top:calc(44px + var(--safe-t));padding-bottom:calc(96px + var(--safe-b))}
.grosstitel{font-family:var(--font-d);font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;
  margin:2px 16px 8px;overflow-wrap:anywhere;hyphens:auto}
.grosstitel.lang{font-size:28px;line-height:34px;letter-spacing:.36px}
.untertitel{margin:-6px 16px 12px;color:var(--text-2);font-size:15px}

/* Tab-Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;
  padding:6px 4px calc(2px + var(--safe-b));background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 -.5px 0 var(--trenner)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--grau);font-size:10px;
  font-weight:500;letter-spacing:.1px;padding-bottom:2px;min-height:46px}
.tab svg{width:27px;height:27px}
.tab.aktiv{color:var(--tint)}

/* ── Listen (inset grouped) ──────────────────────────────────────── */
.gruppe{margin:0 16px 22px}
.gruppe-kopf{font-size:13px;color:var(--text-2);text-transform:uppercase;letter-spacing:-.08px;margin:0 16px 7px 16px;
  display:flex;justify-content:space-between;align-items:flex-end}
.gruppe-kopf.gross{text-transform:none;font-size:20px;font-weight:700;color:var(--text);letter-spacing:.38px;margin:0 0 8px 4px}
.gruppe-kopf button{font-size:15px;color:var(--tint);text-transform:none;letter-spacing:-.24px}
.gruppe-fuss{font-size:13px;color:var(--text-2);margin:7px 16px 0;letter-spacing:-.08px}
.liste{background:var(--karte);border-radius:10px;overflow:hidden}
.zeile-l{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 0 0 16px;position:relative;width:100%;
  text-align:left;color:var(--text);background:var(--karte)}
.zeile-l:active,.zeile-l.gedrueckt{background:var(--karte-2)}
@media (prefers-color-scheme:dark){.zeile-l:active{background:#3A3A3C}}
.zeile-l .koerper{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:11px 16px 11px 0;
  border-bottom:.5px solid var(--trenner);min-height:44px}
.liste > :last-child .koerper,.liste > .zeile-l:last-child .koerper{border-bottom:0}
.zeile-l .text{flex:1;min-width:0}
.zeile-l .t1{font-size:17px;line-height:22px;overflow-wrap:anywhere}
.zeile-l .t2{font-size:15px;line-height:20px;color:var(--text-2);margin-top:1px;overflow-wrap:anywhere}
.zeile-l .t2.klein{font-size:13px;line-height:18px}
.zeile-l .wert{color:var(--text-2);font-size:17px;white-space:nowrap}
.zeile-l .chevron{flex:0 0 auto;width:8px;height:14px;color:var(--text-3)}
.zeile-l .extern{flex:0 0 auto;width:15px;height:15px;color:var(--text-3)}
.symbol{flex:0 0 auto;width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff}
.symbol svg{width:19px;height:19px}
.symbol.rund{border-radius:50%}
.symbol img{width:29px;height:29px;object-fit:contain}
.zeile-l.mit-symbol .koerper{}
.leer{padding:28px 16px;text-align:center;color:var(--text-2);font-size:15px}

/* Dokument-Badge */
.dok-badge{flex:0 0 auto;width:34px;height:42px;border-radius:5px;position:relative;background:var(--karte-2);
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;border:.5px solid var(--trenner)}
.dok-badge b{font-size:9px;font-weight:800;color:#fff;background:var(--tint);border-radius:3px;padding:1px 3px;letter-spacing:.2px}
.dok-badge.doc b{background:var(--blau)}
.dok-badge.web b{background:var(--grau)}
.dok-badge::before{content:"";position:absolute;top:8px;left:7px;right:7px;height:2px;background:var(--text-3);
  box-shadow:0 5px 0 var(--text-3),0 10px 0 var(--text-3)}

/* Suchfeld */
.suche{margin:0 16px 14px;position:relative}
.suche input{width:100%;height:36px;border-radius:10px;border:0;background:var(--fuellung);color:var(--text);
  font:inherit;font-size:17px;padding:0 30px 0 32px;outline:none;-webkit-appearance:none;appearance:none;letter-spacing:-.41px}
.suche input::placeholder{color:var(--text-2)}
.suche input::-webkit-search-cancel-button,.suche input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.suche .lupe{position:absolute;left:9px;top:9px;width:17px;height:17px;color:var(--text-2);pointer-events:none}
.suche .loeschen{position:absolute;right:6px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--text-3);
  color:var(--karte);display:none;align-items:center;justify-content:center}
.suche .loeschen svg{width:8px;height:8px}
.suche.hat-text .loeschen{display:flex}
.suche-knopf{display:flex;align-items:center;gap:6px;height:36px;border-radius:10px;background:var(--fuellung);
  color:var(--text-2);padding:0 9px;margin:0 16px 18px;width:calc(100% - 32px)}
.suche-knopf svg{width:17px;height:17px}

/* Segmented Control */
.segment{display:flex;margin:0 16px 14px;background:var(--fuellung);border-radius:9px;padding:2px;position:relative}
.segment button{flex:1;height:28px;border-radius:7px;font-size:13px;font-weight:500;letter-spacing:-.08px;color:var(--text);
  position:relative;z-index:1;white-space:nowrap}
.segment button.an{background:var(--karte);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
@media (prefers-color-scheme:dark){.segment button.an{background:#636366}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:32px;padding:0 14px;border-radius:16px;background:var(--fuellung);font-size:15px;font-weight:500;
  white-space:nowrap;color:var(--text)}
.chip.an{background:var(--tint);color:#fff}

/* ── Start ───────────────────────────────────────────────────────── */
.held{margin:0 16px 18px;border-radius:14px;overflow:hidden;position:relative;background:var(--karte);aspect-ratio:1000/300}
.held img.foto{width:100%;height:100%;object-fit:cover;display:block}
.held::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.55))}
.held .wappen{position:absolute;left:14px;bottom:12px;width:40px;z-index:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.held .zeilen{position:absolute;left:62px;bottom:13px;z-index:1;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.held .zeilen b{display:block;font-size:20px;font-weight:700;letter-spacing:.38px;line-height:24px}
.held .zeilen span{font-size:13px;opacity:.9}

.eil{margin:0 16px 22px;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;width:calc(100% - 32px);
  text-align:left;background:linear-gradient(135deg,#E8253F,#B70D27);color:#fff;box-shadow:0 6px 18px rgba(200,16,46,.28)}
.eil .ico{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.22);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.eil .ico svg{width:18px;height:18px}
.eil small{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;opacity:.85}
.eil strong{display:block;font-size:17px;line-height:22px;margin-top:2px}

.bgm{display:flex;gap:14px;padding:14px 16px;align-items:center}
.bgm img{width:74px;height:96px;border-radius:10px;object-fit:cover;object-position:50% 18%;flex:0 0 auto;background:var(--karte-2)}
.bgm .rolle{font-size:13px;color:var(--text-2);text-transform:uppercase;letter-spacing:-.08px}
.bgm .name{font-size:20px;font-weight:600;letter-spacing:.38px;line-height:25px;margin:1px 0 2px}
.bgm .zusatz{font-size:15px;color:var(--text-2)}
.aktion-reihe{display:flex;gap:8px;padding:0 16px 14px}
.aktion{flex:1;height:52px;border-radius:10px;background:var(--fuellung);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;color:var(--tint);font-size:12px;font-weight:500}
.aktion svg{width:20px;height:20px}

.termin-kurz{display:flex;gap:12px;align-items:center}
.datum-kachel{flex:0 0 auto;width:44px;border-radius:9px;overflow:hidden;text-align:center;background:var(--karte-2);
  line-height:1}
.datum-kachel i{display:block;font-style:normal;font-size:10px;font-weight:700;color:#fff;background:var(--tint);padding:3px 0;
  text-transform:uppercase;letter-spacing:.3px}
.datum-kachel b{display:block;font-size:20px;font-weight:600;padding:4px 0 5px}
.datum-kachel.neuching i{background:var(--gruen)}

.fusszeile{margin:6px 16px 0;text-align:center;font-size:12px;color:var(--text-2);line-height:17px}
.fusszeile img{width:34px;margin:0 auto 8px;opacity:.9}

/* ── Termine ─────────────────────────────────────────────────────── */
.kalender{margin:0 16px 16px;background:var(--karte);border-radius:12px;padding:10px 8px 8px}
.kal-kopf{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 10px}
.kal-kopf b{font-size:17px;font-weight:600}
.kal-kopf .pfeile{display:flex;gap:18px;color:var(--tint)}
.kal-kopf .pfeile button{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.kal-kopf .pfeile svg{width:11px;height:18px}
.kal-wt,.kal-tage{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.kal-wt span{font-size:13px;font-weight:600;color:var(--text-3);padding-bottom:4px;text-transform:uppercase}
.kal-tag{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding-top:4px;font-size:19px}
.kal-tag .n{width:34px;height:34px;line-height:34px;border-radius:50%}
.kal-tag.leer{visibility:hidden}
.kal-tag.so .n{color:var(--text-2)}
.kal-tag.heute .n{color:var(--tint);font-weight:600}
.kal-tag.gewaehlt .n{background:var(--tint);color:#fff;font-weight:600}
.kal-tag .punkte{display:flex;gap:3px;height:5px;margin-top:-4px}
.kal-tag .punkte i{width:5px;height:5px;border-radius:50%;background:var(--tint)}
.kal-tag .punkte i.neuching{background:var(--gruen)}
.legende{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--text-2);padding-top:6px}
.legende i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tint);margin-right:5px;vertical-align:1px}
.legende i.neuching{background:var(--gruen)}
.termin .zeit{font-size:15px;color:var(--text-2);width:54px;flex:0 0 auto;font-variant-numeric:tabular-nums;line-height:20px;padding-top:1px;align-self:flex-start;margin-top:12px}
.termin .balken{width:4px;align-self:stretch;border-radius:2px;background:var(--tint);margin:10px 0}
.termin .balken.neuching{background:var(--gruen)}
.termin .koerper{align-items:center}

/* ── A–Z ─────────────────────────────────────────────────────────── */
.index-leiste{position:absolute;right:1px;top:calc(50% + 10px);transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;
  align-items:center;padding:4px 3px;touch-action:none}
.index-leiste button{font-size:11px;font-weight:600;color:var(--tint);line-height:14px;width:16px;height:14px}
.az-liste .gruppe{margin-right:26px}
.az-buchstabe{font-size:13px;font-weight:600;color:var(--text-2);margin:0 16px 6px 32px;scroll-margin-top:calc(54px + var(--safe-t))}

/* ── Artikel ─────────────────────────────────────────────────────── */
.artikel{margin:0 16px 20px;background:var(--karte);border-radius:12px;padding:16px;overflow:hidden}
.inhalt{font-size:17px;line-height:1.47;letter-spacing:-.3px;overflow-wrap:anywhere;hyphens:auto}
.inhalt>:first-child{margin-top:0}.inhalt>:last-child{margin-bottom:0}
.inhalt p{margin:0 0 12px}
.inhalt h2,.inhalt h3,.inhalt h4,.inhalt h5{font-family:var(--font-d);line-height:1.25;margin:18px 0 8px;letter-spacing:.2px}
.inhalt h2{font-size:22px}.inhalt h3{font-size:20px}.inhalt h4,.inhalt h5{font-size:17px}
.inhalt ul,.inhalt ol{padding-left:22px;margin:0 0 12px}
.inhalt li{margin-bottom:5px}
.inhalt img{max-width:100%;height:auto;border-radius:10px;display:block;margin:4px 0}
.inhalt hr{border:0;border-top:.5px solid var(--trenner);margin:16px 0}
.inhalt table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:15px}
.inhalt td,.inhalt th{padding:8px 6px;vertical-align:top;border-bottom:.5px solid var(--trenner);text-align:left}
.inhalt td p{margin:0}
.inhalt td{hyphens:manual}
.inhalt td:empty{display:none}
.inhalt table table td{display:block;border:0;padding:4px 0}
.inhalt a{color:var(--tint)}
.inhalt a.tel,.inhalt a.mail{white-space:nowrap}
.inhalt a.dok{display:inline-flex;align-items:center;gap:9px;max-width:100%;margin:4px 0;padding:8px 12px 8px 8px;border-radius:10px;
  background:var(--tint-weich);color:var(--tint);font-weight:500;font-size:15px;line-height:20px;white-space:normal;vertical-align:middle;text-decoration:none}
.inhalt a.dok .mini{flex:0 0 auto;font-size:9px;font-weight:800;color:#fff;background:var(--tint);border-radius:4px;padding:3px 4px;letter-spacing:.2px;line-height:1}
.inhalt a.dok .mini.doc{background:var(--blau)}
.inhalt a.dok .mini.web{background:var(--grau)}
.inhalt a.intern{font-weight:500}
.inhalt a.dok.fehlt{background:var(--fuellung);color:var(--text-2)}
.inhalt a.dok.fehlt .mini{background:var(--grau)}
.inhalt a.dok small{font-weight:400;font-size:12px}
.zeile-l.fehlt .t1{color:var(--text-2)}
.zeile-l.fehlt .dok-badge b{background:var(--grau)}
.inhalt a.extern::after{content:" ↗";font-size:.8em}
.quelle{margin:0 16px 24px}
.quelle .liste .zeile-l .t1{color:var(--tint)}

/* Drucken / Teilen-Hinweis */
.hinweis{margin:0 16px 18px;padding:12px 14px;border-radius:12px;background:var(--karte);font-size:15px;color:var(--text-2);display:flex;gap:10px;align-items:flex-start}
.hinweis svg{flex:0 0 auto;width:20px;height:20px;color:var(--tint);margin-top:1px}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,20px);opacity:0;z-index:99;
  background:rgba(30,30,30,.92);color:#fff;font-size:15px;padding:10px 16px;border-radius:12px;transition:all .25s;pointer-events:none;max-width:86vw;text-align:center}
.toast.zeigen{opacity:1;transform:translate(-50%,0)}

@media (min-width:700px){
  .scroll>*{max-width:680px;margin-left:auto;margin-right:auto}
  .scroll>.gruppe,.scroll>.artikel,.scroll>.held,.scroll>.kalender,.scroll>.quelle,.scroll>.hinweis,.scroll>.eil{margin-left:auto;margin-right:auto}
  .scroll>.suche,.scroll>.segment,.scroll>.suche-knopf{margin-left:auto;margin-right:auto;width:680px;max-width:calc(100% - 32px)}
  .scroll>.grosstitel{padding:0}
}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>
<script src="daten.js"></script>
<script src="app.js"></script>
</body>
</html>
