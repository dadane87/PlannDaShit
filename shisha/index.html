<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Shisha Express</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@600;800&display=swap">
<style>
/* Layout: one full-screen canvas, HUD drawn on it, HTML only for title/fail/win cards and the touch pad. */
:root{
  --ink:#0d0f14; --panel:#16181f; --hud:#f7d21e; --hot:#ff3b5c; --mint:#38f0b6; --paper:#f4f1e8; --lcd:#b9d66e;
  --display:'Bungee',Impact,'Arial Black',sans-serif;
  --body:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--body)}
#ov[hidden],#mute[hidden]{display:none}
#game{position:fixed;inset:0;display:block;width:100%;height:100%}
#safe{position:fixed;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(ellipse at 50% 40%,rgba(13,15,20,.55),rgba(13,15,20,.92));z-index:5;overflow:auto}
.card{max-width:520px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.face{width:min(46vw,190px);aspect-ratio:1;border-radius:50%;border:5px solid var(--hud);box-shadow:0 0 0 5px var(--ink),0 0 40px rgba(247,210,30,.35);
  background-size:cover;background-position:center;animation:jit .18s steps(2) infinite}
.face.spin{animation:spin 1.4s linear infinite}
@keyframes jit{0%{transform:translate(-2px,1px) rotate(-3deg)}100%{transform:translate(2px,-1px) rotate(3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,11vw,74px);line-height:.9;margin:0;color:var(--hud);
  text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),6px 7px 0 var(--hot);text-wrap:balance}
h1.bad{color:var(--hot);text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),6px 7px 0 var(--hud)}
.route{font-family:var(--body);font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper);
  display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px}
.route b{color:var(--hud);font-weight:800}
.lead{font-size:20px;font-weight:600;line-height:1.25;margin:0;max-width:30ch;color:#d9d6cc}
.keys{font-size:16px;font-weight:600;color:#a7a59d;line-height:1.35;margin:0}
.btn{font-family:var(--display);font-size:24px;color:var(--ink);background:var(--hud);border:0;border-radius:6px;padding:14px 30px 12px;
  box-shadow:5px 5px 0 var(--hot);cursor:pointer;letter-spacing:.02em}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--hot)}
.btn:focus-visible{outline:3px solid var(--mint);outline-offset:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:400px}
.stats div{background:var(--panel);border:2px solid #2a2d36;border-radius:6px;padding:8px 4px}
.stats span{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#a7a59d;font-weight:600}
.stats strong{font-family:var(--display);font-weight:400;font-size:24px;color:var(--hud);font-variant-numeric:tabular-nums}
#pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;gap:12px;z-index:3;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
#pad .grp{display:flex;gap:12px;align-items:flex-end}
#pad button{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(13,15,20,.45);
  color:#fff;font-family:var(--display);font-size:15px;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
#pad button.on{background:rgba(247,210,30,.55);border-color:var(--hud)}
#pad button.gas{width:92px;height:92px;background:rgba(56,240,182,.25);border-color:var(--mint)}
#pad button.gas.on{background:rgba(56,240,182,.6)}
#pad button.brk{background:rgba(255,59,92,.22);border-color:var(--hot)}
#pad button.brk.on{background:rgba(255,59,92,.6)}
#pad svg{width:34px;height:34px;fill:#fff}
body.touch #pad{display:flex}
#mute{position:fixed;z-index:4;bottom:max(12px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  background:rgba(13,15,20,.55);border:2px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;font:600 14px var(--body);
  padding:5px 12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
body.touch #mute{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 150px);left:auto;right:max(12px,env(safe-area-inset-right,0px));transform:none}
@media (prefers-reduced-motion:reduce){.face{animation:none}}
</style>

</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<div id="pad">
  <div class="grp">
    <button data-k="left" aria-label="Links"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8z"/></svg></button>
    <button data-k="right" aria-label="Rechts"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8z"/></svg></button>
  </div>
  <div class="grp">
    <button data-k="down" class="brk">BREMS</button>
    <button data-k="up" class="gas">GAS</button>
  </div>
</div>
<button id="mute" hidden>Ton: an</button>
<div id="ov"></div>

let world=null;
function surfAt(x,y){const w=world;if(x<0||y<0||x>=w.W||y>=w.H)return 9;return w.surf[((y/G)|0)*w.gw+((x/G)|0)];}
function paintPoly(w,pts,r,val){
  for(let i=1;i<pts.length;i++){const[ax,ay]=pts[i-1],[bx,by]=pts[i];
    const gx0=Math.max(0,Math.floor((Math.min(ax,bx)-r)/G)),gx1=Math.min(w.gw-1,Math.floor((Math.max(ax,bx)+r)/G));
    const gy0=Math.max(0,Math.floor((Math.min(ay,by)-r)/G)),gy1=Math.min(w.gh-1,Math.floor((Math.max(ay,by)+r)/G));
    for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){if(distSeg((gx+.5)*G,(gy+.5)*G,ax,ay,bx,by)<=r)w.surf[gy*w.gw+gx]=val;}}
}
function paintRect(w,x0,y0,x1,y1,val){for(let gy=Math.max(0,Math.floor(y0/G));gy<=Math.min(w.gh-1,Math.floor((y1-1)/G));gy++)for(let gx=Math.max(0,Math.floor(x0/G));gx<=Math.min(w.gw-1,Math.floor((x1-1)/G));gx++)w.surf[gy*w.gw+gx]=val;}
function areaBad(w,x0,y0,x1,y1){for(let y=y0+20;y<=y1-20;y+=16)for(let x=x0+20;x<=x1-20;x+=16){const s=surfAt(x,y);if(s!==0)return true;}return false;}
function rectsOverlap(a,b){return a.x0<b.x1&&a.x1>b.x0&&a.y0<b.y1&&a.y1>b.y0;}

const ROOFS=[['#7a7f88','#5b5f67'],['#8d6e5a','#6b5141'],['#9a9a8c','#76766a'],['#b0553f','#86402f'],['#6c7d8f','#4f5d6c'],['#a68f64','#7f6c4a'],['#5e6a5a','#465045'],['#c2b8a3','#958d7c']];
function addBuilding(w,x0,y0,x1,y1,h,opt){
  opt=opt||{};const pal=opt.pal||pick(ROOFS);
  const b={type:'r',x0,y0,x1,y1,h,roof:pal[0],wall:pal[1],det:[],label:opt.label,kind:opt.kind};
  const bw=x1-x0,bh=y1-y0,n=(bw*bh/4000)|0;
  if(!opt.kind)for(let i=0;i<Math.min(4,n);i++){const s=8+R()*10;b.det.push([R()*(bw-s-8)+4,R()*(bh-s-8)+4,s,s*(0.7+R()*.6)]);}

}
function addTree(w,x,y,r){const t={type:'c',x,y,r:r*0.55,cr:r,h:1+R()*0.6,c1:pick(['#2f6b2c','#3a7a33','#2a5f2a','#447f36']),c2:pick(['#4f9443','#5ba34c','#3f8a3b'])};w.trees.push(t);w.sh.add(t,x-r,y-r,x+r,y+r);}
function treeFree(w,x,y,r){
  if(surfAt(x,y)!==0||surfAt(x+r+12,y)!==0||surfAt(x-r-12,y)!==0||surfAt(x,y+r+12)!==0||surfAt(x,y-r-12)!==0)return false;
  for(const c of w.cityRects)if(x>c.x0-20&&x<c.x1+20&&y>c.y0-20&&y<c.y1+20)return false;
  for(const s of w.reserved)if(x>s.x0-30&&x<s.x1+30&&y>s.y0-30&&y<s.y1+30)return false;
  let ok=true;w.sh.query(x-r-20,y-r-20,x+r+20,y+r+20,o=>{ok=false;});return ok;
}
function addRoad(w,r){
  const pts=r.pts.map(p=>[p[0]*T,p[1]*T]),cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+hyp(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const wd=r.w*T,rd={kind:r.kind,pts,cum,len:cum[cum.length-1],w:wd,
    x0:Math.min(...pts.map(p=>p[0]))-wd,x1:Math.max(...pts.map(p=>p[0]))+wd,y0:Math.min(...pts.map(p=>p[1]))-wd,y1:Math.max(...pts.map(p=>p[1]))+wd};
  if(r.kind==='hw'){rd.lanes=[wd*0.14,wd*0.34];rd.dash=[offsetPts(pts,wd*0.24),offsetPts(pts,-wd*0.24)];rd.edge=[offsetPts(pts,wd/2-7),offsetPts(pts,-wd/2+7)];}

function buildWorld(spec){

    c.xs=xs;c.ys=ys;w.cityRects.push({x0:c.x0*T,y0:c.y0*T,x1:c.x1*T,y1:c.y1*T});
    for(const x of xs)addRoad(w,{kind:'street',w:c.sw,pts:[[x,c.y0],[x,c.y1]]});

    if(s.type==='dom')addBuilding(w,o.x0,o.y0,o.x1,o.y1,7,{pal:['#6f6a66','#4f4b48'],label:'DOM',kind:'dom'});

  }
  // city blocks
  for(const c of spec.cities){

      const b={x0:(c.xs[i]+c.sw/2)*T,y0:(c.ys[j]+c.sw/2)*T,x1:(c.xs[i+1]-c.sw/2)*T,y1:(c.ys[j+1]-c.sw/2)*T};

      const sub=(x0,y0,x1,y1,d)=>{const bw=x1-x0,bh=y1-y0;
        if(d>0&&Math.max(bw,bh)>140&&R()<0.85){if(bw>bh){const m=x0+bw*(.35+R()*.3);sub(x0,y0,m,y1,d-1);sub(m,y0,x1,y1,d-1);}else{const m=y0+bh*(.35+R()*.3);sub(x0,y0,x1,m,d-1);sub(x0,m,x1,y1,d-1);}return;}
        addBuilding(w,x0,y0,x1,y1,c.hmin+R()*(c.hmax-c.hmin));};

  }

        let ok=true;for(const p of w.parked)if(Math.abs(p.x-x)<44&&Math.abs(p.y-y)<30)ok=false;
        const ft=spec.foot;if(ft&&hyp(ft.x*T-x,ft.y*T-y)<90)ok=false;if(hyp(spec.goal.x*T-x,spec.goal.y*T-y)<110)ok=false;
        if(!ok)continue;const m=trafficModel(false);const p={x,y,a:Math.PI/2,m};w.parked.push(p);n--;
        const o={type:'r',x0:x-m.wid/2,y0:y-m.len/2,x1:x+m.wid/2,y1:y+m.len/2};w.sh.add(o,o.x0,o.y0,o.x1,o.y1);}
    }
  }
  // fields
  const nf=(spec.w*spec.h/260)|0;
  for(let i=0;i<nf;i++){const fw=(5+R()*12)*T,fh=(4+R()*10)*T,x=R()*(w.W-fw),y=R()*(w.H-fh);const f={x0:x,y0:y,x1:x+fw,y1:y+fh,c:pick(['#7b8f3a','#9a8c3e','#6f7f33','#8a6a3c','#5f8a3a','#a39443']),v:R()<.5};
    let bad=false;for(const c of w.cityRects)if(rectsOverlap(f,c))bad=true;if(!bad)w.fields.push(f);}

  // pickups (clocks)
  const main=w.roads.filter(r=>r.kind!=='street');
  const np=spec.pickups||5;
  for(let i=0;i<np;i++){let rd,s;if(main.length&&!spec.pickups){rd=main[i%main.length];s=(0.15+0.7*R())*rd.len;}else{rd=pick(w.roads);s=(0.1+0.8*R())*rd.len;}
    const p=pointAt(rd,s);if(hyp(p.x-spec.start.x*T,p.y-spec.start.y*T)<500)continue;w.pickups.push({x:p.x,y:p.y,on:true});}
  for(const b of spec.blitzer||[])w.blitzers.push({x:b[0]*T,y:b[1]*T,done:false});
  w.zones=(spec.zones||[]).map(z=>({x0:z[0]*T,y0:z[1]*T,x1:z[2]*T,y1:z[3]*T,name:z[4]}));
  w.cps=(spec.checkpoints||[]).map(c=>({x:c[0]*T,y:c[1]*T}));
  w.goal={x:spec.goal.x*T,y:spec.goal.y*T,r:spec.goal.r*T};
  w.roadW=w.roads.map(r=>r.len*(r.kind==='street'?0.6:1.4));w.roadWsum=w.roadW.reduce((a,b)=>a+b,0);
  buildMini(w);
  return w;
}
function buildMini(w){
  const c=document.createElement('canvas');c.width=w.gw;c.height=w.gh;const g=c.getContext('2d');const img=g.createImageData(w.gw,w.gh);
  const col={0:[58,98,46],1:[205,203,190],2:[61,134,184],4:[150,150,146]};
  for(let i=0;i<w.surf.length;i++){const k=col[w.surf[i]]||col[0];img.data[i*4]=k[0];img.data[i*4+1]=k[1];img.data[i*4+2]=k[2];img.data[i*4+3]=255;}
  g.putImageData(img,0,0);g.fillStyle='#2a2c31';for(const b of w.buildings)g.fillRect(b.x0/G,b.y0/G,(b.x1-b.x0)/G,(b.y1-b.y0)/G);
  g.fillStyle='#2e5a27';for(const t of w.trees)g.fillRect(t.x/G-.5,t.y/G-.5,1.4,1.4);
  w.mini=c;
}

// ---------- state ----------
const S={mode:'title',leg:0,time:0,clock:0,crashes:0,flashes:0,legT:0,msg:null,pager:null,pagerQ:[],shake:0,faceHit:0,flash:0,
  zone:'',zoneT:0,cpi:0,introT:0,police:null,nextCar:null,trans:0,tick:0,best:null,tries:0,blitzWarn:0};
let player=null,walker=null,traffic=[],parts=[],skids=[];
const cam={x:0,y:0,z:1};
try{const b=localStorage.getItem('shishaexpress-best');if(b)S.best=parseFloat(b);}catch(e){}

function baseZoom(){return clamp(Math.min(W,H)/640,0.6,1.15);}
function message(text,sub,dur,color){S.msg={text,sub:sub||'',t:0,dur:dur||1.8,color:color||'#f7d21e'};}
function startLeg(i,retry){
  S.leg=i;const spec=LEGS[i];buildWorld(spec);
  traffic=[];parts=[];skids=[];S.police=null;walker=null;S.nextCar=null;S.cpi=0;S.legT=0;S.zone='';S.blitzWarn=0;
  player=makeCar(spec.car,spec.start.x*T,spec.start.y*T,spec.start.a);
  if(retry)S.time=spec.time+5;
  cam.x=player.x;cam.y=player.y;cam.z=baseZoom();
  for(let k=0;k<spec.traffic*1.2;k++)spawnTraffic(true);
  S.pagerQ=spec.pager.map(p=>({t:p[0],text:p[1]}));S.pager=null;
  S.mode='intro';S.introT=2.4;
  message('ETAPPE '+(i+1)+'/4',spec.title,2.2);
  hideOverlay();
}
function nextLeg(){
  const n=S.leg+1;S.mode='trans';S.trans=0;S.transTo=n;
}

// ---------- traffic ----------
function spawnTraffic(initial){
  const w=world;if(!w.roads.length)return;
  for(let tries=0;tries<12;tries++){
    let r=R()*w.roadWsum,i=0;while(i<w.roads.length-1&&r>w.roadW[i]){r-=w.roadW[i];i++;}
    const rd=w.roads[i];if(rd.len<200)continue;
    const s=20+R()*(rd.len-40);const p=pointAt(rd,s);
    const d=hyp(p.x-player.x,p.y-player.y);const view=Math.max(W,H)/cam.z*0.6+120;
    if(d<(initial?380:view)||d>(initial?2400:2100))continue;
    const dir=R()<.5?1:-1;const lane=pick(rd.lanes);
    const truck=rd.kind==='hw'&&R()<(w.spec.trucks||0.15);
    const m=trafficModel(truck);
    const lanes=rd.lanes;const slow=lane===lanes[lanes.length-1]&&lanes.length>1;
    const vmax=rd.kind==='hw'?(truck?330:slow?460:560):rd.kind==='road'?(380+R()*80):(230+R()*90);
    let blocked=false;for(const o of traffic)if(o.rd===rd&&Math.abs(o.s-s)<180)blocked=true;if(blocked)continue;
    const c={rd,s,dir,lane,m,v:vmax*.8,vmax,stun:0,ox:0,oy:0,spin:0,sa:0,x:p.x,y:p.y,a:0,honk:0};
    placeTraffic(c);traffic.push(c);return;
  }
}
function placeTraffic(c){
  const p1=pointAt(c.rd,c.s-26*c.dir),p2=pointAt(c.rd,c.s+26*c.dir);
  let hx=p2.x-p1.x,hy=p2.y-p1.y;const L=hyp(hx,hy)||1;hx/=L;hy/=L;
  c.x=(p1.x+p2.x)/2-hy*c.lane+c.ox;c.y=(p1.y+p2.y)/2+hx*c.lane+c.oy;c.a=Math.atan2(hy,hx)+c.sa;c.hx=hx;c.hy=hy;
}
function updateTraffic(dt){
  const spec=world.spec;
  for(const c of traffic){
    if(c.stun>0){c.stun-=dt;c.v=0;c.sa+=c.spin*dt;c.spin*=Math.exp(-dt*3);c.ox+=c.kx*dt;c.oy+=c.ky*dt;c.kx*=Math.exp(-dt*5);c.ky*=Math.exp(-dt*5);placeTraffic(c);continue;}
    c.ox*=Math.exp(-dt*1.5);c.oy*=Math.exp(-dt*1.5);c.sa*=Math.exp(-dt*2);
    let target=c.vmax;
    for(const o of traffic){if(o===c||o.rd!==c.rd||o.dir!==c.dir||o.lane!==c.lane)continue;const gap=(o.s-c.s)*c.dir;if(gap>0&&gap<c.m.len/2+o.m.len/2+90){target=Math.min(target,gap<c.m.len/2+o.m.len/2+30?0:o.v);}}
    const obs=[player];if(walker)obs.push(walker);if(S.police)obs.push(S.police);if(S.nextCar)obs.push(S.nextCar);
    let blockedByPlayer=false;
    for(const o of obs){const rx=o.x-c.x,ry=o.y-c.y,f=rx*c.hx+ry*c.hy,l=Math.abs(-rx*c.hy+ry*c.hx);if(f>0&&f<c.m.len/2+120&&l<34){target=0;if(o===player)blockedByPlayer=true;}}
    if(blockedByPlayer&&c.v<20){c.honk+=dt;if(c.honk>1.4){c.honk=-2-R()*3;sfx('honk');}}
    c.v+=clamp(target-c.v,-1100*dt,260*dt);
    c.s+=c.v*dt*c.dir;placeTraffic(c);
    if(c.s<0||c.s>c.rd.len)c.dead=true;
  }
  traffic=traffic.filter(c=>!c.dead&&hyp(c.x-player.x,c.y-player.y)<2600);
  if(traffic.length<spec.traffic)spawnTraffic(false);
}

// ---------- physics ----------
function collideWorld(o,circles){
  let px=0,py=0;
  for(const ci of circles){let cx=ci[0]+px,cy=ci[1]+py;const r=ci[2];
    const w=world;
    if(cx<r){px+=r-cx;cx=r;} if(cy<r){py+=r-cy;cy=r;} if(cx>w.W-r){px-=cx-(w.W-r);cx=w.W-r;} if(cy>w.H-r){py-=cy-(w.H-r);cy=w.H-r;}
    const res=(qx,qy)=>{const dx=cx-qx,dy=cy-qy,d=hyp(dx,dy);if(d<r&&d>0.001){const p=r-d;px+=dx/d*p;py+=dy/d*p;cx+=dx/d*p;cy+=dy/d*p;}};
    const rect=(x0,y0,x1,y1)=>{if(cx>x0&&cx<x1&&cy>y0&&cy<y1){const l=cx-x0,rr=x1-cx,t=cy-y0,b=y1-cy,m=Math.min(l,rr,t,b);
        if(m===l){px-=l+r;cx-=l+r;}else if(m===rr){px+=rr+r;cx+=rr+r;}else if(m===t){py-=t+r;cy-=t+r;}else{py+=b+r;cy+=b+r;}return;}
      res(clamp(cx,x0,x1),clamp(cy,y0,y1));};
    w.sh.query(cx-r,cy-r,cx+r,cy+r,s=>{if(s.type==='r')rect(s.x0,s.y0,s.x1,s.y1);else{const dx=cx-s.x,dy=cy-s.y,d=hyp(dx,dy),rr=r+s.r;if(d<rr&&d>0.001){const p=rr-d;px+=dx/d*p;py+=dy/d*p;cx+=dx/d*p;cy+=dy/d*p;}}});
    for(let gy=Math.floor((cy-r)/G);gy<=Math.floor((cy+r)/G);gy++)for(let gx=Math.floor((cx-r)/G);gx<=Math.floor((cx+r)/G);gx++){
      if(gx<0||gy<0||gx>=w.gw||gy>=w.gh)continue;if(w.surf[gy*w.gw+gx]===2)rect(gx*G,gy*G,gx*G+G,gy*G+G);}
  }
  if(px||py){o.x+=px;o.y+=py;const L=hyp(px,py),nx=px/L,ny=py/L,vn=o.vx*nx+o.vy*ny;
    if(vn<0){o.vx-=1.3*vn*nx;o.vy-=1.3*vn*ny;o.vx*=.88;o.vy*=.88;return {imp:-vn,nx,ny};}}
  return null;
}
function updateCar(c,dt,inp){
  const m=c.m,fx=Math.cos(c.a),fy=Math.sin(c.a);
  let vf=c.vx*fx+c.vy*fy,vl=-c.vx*fy+c.vy*fx;
  const s=surfAt(c.x,c.y),off=s===0;
  const maxV=off?m.maxOff:m.max;
  c.brake=false;
  if(inp.up){if(vf<maxV)vf+=m.acc*dt*(vf<0?2.2:1)*(vf>maxV*0.7?0.6:1);}
  else if(inp.down){if(vf>15){vf-=m.brake*dt;c.brake=true;}else vf-=m.acc*0.55*dt;}
  else vf-=Math.sign(vf)*Math.min(Math.abs(vf),(off?420:240)*dt);
  if(vf>maxV)vf-=(vf-maxV)*Math.min(1,dt*(off?2.5:1.2));
  if(vf<-m.maxRev)vf=-m.maxRev;
  const st=(inp.right?1:0)-(inp.left?1:0);
  const sf=Math.min(1,Math.abs(vf)/170)*(Math.abs(vf)>600?0.82:1);
  c.a+=st*m.turn*sf*(vf<0?-1:1)*dt;
  vl*=Math.exp(-dt*(off?4.5:8.5));
  c.vx=fx*vf-fy*vl;c.vy=fy*vf+fx*vl;
  // skid
  if(Math.abs(vl)>110||(c.brake&&vf>300)){const nfx=Math.cos(c.a),nfy=Math.sin(c.a);
    for(const sd of[-1,1]){const x=c.x-nfx*m.len*.35-nfy*sd*m.wid*.38,y=c.y-nfy*m.len*.35+nfx*sd*m.wid*.38;skids.push([x,y,x-c.vx*dt,y-c.vy*dt]);}
    if(skids.length>900)skids.splice(0,skids.length-900);}
  c.x+=c.vx*dt;c.y+=c.vy*dt;c.vf=vf;
  if(off&&Math.abs(vf)>200&&R()<dt*20)puff(c.x-fx*30,c.y-fy*30,'#8a7a55',8);
  return collideWorld(c,carCircles(c.x,c.y,c.a,m));
}
function crashFx(x,y,imp){
  S.shake=Math.min(18,S.shake+imp/40);S.faceHit=0.5;S.crashes++;
  for(let i=0;i<14;i++)parts.push({x,y,vx:(R()-.5)*360,vy:(R()-.5)*360,life:.5,max:.5,s:3,c:pick(['#ffd34a','#fff','#ff8b2b']),k:'spark'});
  for(let i=0;i<5;i++)puff(x,y,'#555',16);
  sfx('crash',Math.min(1,imp/500));
  if(imp>320)message(pick(['BUMM!','KRACH!','AUTSCH!','SCHEPPER!']),'',0.8,'#ff3b5c');
}
function puff(x,y,c,s){parts.push({x,y,vx:(R()-.5)*40,vy:(R()-.5)*40,life:.9,max:.9,s,c,k:'smoke'});}
function vehicleHit(a,b,mb){ // a: dynamic (player/police), b: traffic or car; returns impact
  const ca=carCircles(a.x,a.y,a.a,a.m),cb=carCircles(b.x,b.y,b.a,b.m);let best=null;
  for(const p of ca)for(const q of cb){const dx=p[0]-q[0],dy=p[1]-q[1],d=hyp(dx,dy),rr=p[2]+q[2];if(d<rr&&d>0.01){const pen=rr-d;if(!best||pen>best.pen)best={pen,nx:dx/d,ny:dy/d,x:(p[0]+q[0])/2,y:(p[1]+q[1])/2};}}
  if(!best)return null;
  a.x+=best.nx*best.pen;a.y+=best.ny*best.pen;
  const bvx=(b.vx!==undefined?b.vx:(b.hx||0)*(b.v||0)*(b.dir||1)),bvy=(b.vy!==undefined?b.vy:(b.hy||0)*(b.v||0)*(b.dir||1));
  const rvx=a.vx-bvx,rvy=a.vy-bvy,vn=rvx*best.nx+rvy*best.ny;
  if(vn<0){const k=mb?1.7:1.3;a.vx-=k*vn*best.nx;a.vy-=k*vn*best.ny;a.vx*=.85;a.vy*=.85;}
  best.imp=Math.max(0,-vn);return best;
}

// ---------- walker ----------
function updateWalker(dt,inp){
  const w=walker;const st=(inp.right?1:0)-(inp.left?1:0);w.a+=st*4.2*dt;
  const sp=inp.up?250:inp.down?-120:0;const fx=Math.cos(w.a),fy=Math.sin(w.a);
  if(w.stun>0){w.stun-=dt;w.x+=w.kx*dt;w.y+=w.ky*dt;w.kx*=Math.exp(-dt*4);w.ky*=Math.exp(-dt*4);}
  else{w.vx=fx*sp;w.vy=fy*sp;w.x+=w.vx*dt;w.y+=w.vy*dt;}
  w.step+=Math.abs(sp)*dt*0.06;
  collideWorld(w,[[w.x,w.y,13]]);
  for(const car of [player,S.nextCar]){if(!car||car===S.nextCar)continue;
    for(const q of carCircles(car.x,car.y,car.a,car.m)){const dx=w.x-q[0],dy=w.y-q[1],d=hyp(dx,dy),rr=q[2]+13;if(d<rr&&d>.01){w.x+=dx/d*(rr-d);w.y+=dy/d*(rr-d);}}}
  for(const c of traffic){if(hyp(c.x-w.x,c.y-w.y)>90)continue;
    for(const q of carCircles(c.x,c.y,c.a,c.m)){const dx=w.x-q[0],dy=w.y-q[1],d=hyp(dx,dy),rr=q[2]+13;
      if(d<rr&&d>.01&&w.stun<=0){w.stun=.6;const sp2=Math.max(300,c.v*1.2);w.kx=dx/d*sp2;w.ky=dy/d*sp2;S.faceHit=.6;S.shake=8;sfx('crash',.5);message('AUA!','',0.7,'#ff3b5c');}}}
  const nc=S.nextCar;if(nc&&hyp(nc.x-w.x,nc.y-w.y)<52){sfx('door');enterNext();}
}
function enterNext(){
  S.mode='trans';S.trans=0;S.transTo=S.leg+1;walker=null;
}

// ---------- game flow ----------
function onGoal(){
  const spec=world.spec;sfx('goal');
  if(spec.foot){
    S.mode='foot';const ang=player.a-Math.PI/2;
    walker={x:player.x+Math.cos(ang)*34,y:player.y+Math.sin(ang)*34,a:Math.atan2(spec.foot.y*T-player.y,spec.foot.x*T-player.x),vx:0,vy:0,step:0,stun:0,kx:0,ky:0};
    player.vx=player.vy=0;
    message(spec.foot.msg,'',1.6);
  }else if(S.leg===LEGS.length-1){win();}
  else{message('GESCHAFFT!','weiter geht’s',1.2);nextLeg();}
}
function fail(){
  S.mode='fail';sfx('fail');engineOff();
  const spec=LEGS[S.leg];
  showOverlay(`<div class="card"><div class="face spin" style="background-image:url(${FACE_SRC})"></div>
  <h1 class="bad">ZU SPÄT!</h1><p class="lead">Die Kohle ist durch. Du bist auf Etappe ${S.leg+1} stecken geblieben: ${spec.title}.</p>
  <button class="btn" id="b1">Etappe nochmal</button><p class="keys">Du bekommst 5 Sekunden extra.</p></div>`);
  document.getElementById('b1').onclick=()=>{S.tries++;startLeg(S.leg,true);};
}
function win(){
  S.mode='win';sfx('win');engineOff();
  const total=S.clock;let rec=false;
  if(S.tries===0&&(S.best===null||total<S.best)){S.best=total;rec=true;try{localStorage.setItem('shishaexpress-best',String(total));}catch(e){}}
  showOverlay(`<div class="card"><div class="face" style="background-image:url(${FACE_SRC})"></div>
  <h1>SHISHA TIME!</h1><p class="lead">Von München bis in die Lounge in Regensburg. Der Doppelapfel ist noch warm.</p>
  <div class="stats"><div><span>Fahrzeit</span><strong>${total.toFixed(1)}s</strong></div><div><span>Restzeit</span><strong>${fmtT(S.time)}s</strong></div><div><span>Unfälle</span><strong>${S.crashes}</strong></div></div>
  <p class="keys">${S.tries?`Mit ${S.tries} Neustart${S.tries>1?'s':''}. Ohne Neustart zählt die Bestzeit.`:rec?'Neue Bestzeit!':S.best!==null?'Bestzeit: '+S.best.toFixed(1)+' s':''}${S.flashes?` · ${S.flashes}× geblitzt`:''}</p>
  <button class="btn" id="b1">Nochmal von vorn</button></div>`);
  document.getElementById('b1').onclick=newGame;
}
function newGame(){S.time=LEGS[0].time;S.clock=0;S.crashes=0;S.flashes=0;S.tries=0;audioInit();startLeg(0,false);}
function showOverlay(h){ov.innerHTML=h;ov.hidden=false;const b=ov.querySelector('button');if(b&&!TOUCH)b.focus();}
function hideOverlay(){ov.hidden=true;ov.innerHTML='';}

// ---------- audio ----------
let AC=null,engOsc=null,engGain=null,sirenOsc=null,sirenGain=null,muted=false;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    engOsc=AC.createOscillator();engOsc.type='sawtooth';const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=520;
    engGain=AC.createGain();engGain.gain.value=0;engOsc.connect(f);f.connect(engGain);engGain.connect(AC.destination);engOsc.start();
    sirenOsc=AC.createOscillator();sirenOsc.type='square';sirenGain=AC.createGain();sirenGain.gain.value=0;sirenOsc.connect(sirenGain);sirenGain.connect(AC.destination);sirenOsc.start();
    muteBtn.hidden=false;
  }catch(e){AC=null;}
}
function engineOff(){if(engGain&&AC)engGain.gain.setTargetAtTime(0,AC.currentTime,.05);if(sirenGain&&AC)sirenGain.gain.setTargetAtTime(0,AC.currentTime,.05);}
function toggleMute(){muted=!muted;muteBtn.textContent='Ton: '+(muted?'aus':'an');if(muted)engineOff();}
muteBtn.onclick=()=>{toggleMute();muteBtn.blur();};
function tone(freq,dur,type,vol,slide){if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=freq;
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+dur);g.gain.value=vol||.06;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);}
function noise(dur,vol){if(!AC||muted)return;const n=AC.sampleRate*dur|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=vol;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();}
function sfx(k,v){
  if(k==='crash')noise(.35,.25+.35*(v||.5));
  else if(k==='pickup'){tone(880,.08,'square',.05);setTimeout(()=>tone(1320,.12,'square',.05),70);}
  else if(k==='goal'){tone(660,.1,'square',.06);setTimeout(()=>tone(990,.18,'square',.06),90);}
  else if(k==='tick')tone(1500,.05,'square',.04);
  else if(k==='honk'){tone(392,.25,'sawtooth',.035);tone(466,.25,'sawtooth',.03);}
  else if(k==='flash'){tone(2400,.06,'sine',.06);}
  else if(k==='door')tone(220,.08,'square',.06,110);
  else if(k==='fail'){tone(330,.5,'sawtooth',.06,90);}
  else if(k==='win'){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18,'square',.05),i*110));}
  else if(k==='go')tone(1046,.25,'square',.06);
  else if(k==='count')tone(523,.12,'square',.05);
}
function updateAudio(){
  if(!AC||muted)return;const t=AC.currentTime;
  if(S.mode==='drive'||S.mode==='intro'){const sp=Math.abs(player.vf||0);engOsc.frequency.setTargetAtTime(48+sp*0.16+(inp().up?14:0),t,.05);engGain.gain.setTargetAtTime(.035+(inp().up?.02:0),t,.1);}
  else if(S.mode==='foot'){engGain.gain.setTargetAtTime(0,t,.1);}
  if(S.police&&(S.mode==='drive')){sirenOsc.frequency.setTargetAtTime((Math.floor(S.clock*2.4)%2)?640:880,t,.01);sirenGain.gain.setTargetAtTime(.018,t,.05);}
  else sirenGain.gain.setTargetAtTime(0,t,.05);
}

// ---------- update ----------
function update(dt){
  if(S.mode==='title'){cam.x+=dt*120;if(cam.x>world.W-800)cam.x=600;player.x=cam.x;player.y=cam.y;updateTraffic(dt);return;}
  if(S.mode==='pause'||S.mode==='fail'||S.mode==='win')return;
  if(S.msg){S.msg.t+=dt;if(S.msg.t>S.msg.dur)S.msg=null;}
  if(S.mode==='trans'){S.trans+=dt;if(S.trans>0.55){const n=S.transTo;S.time+=LEGS[n].time;startLeg(n,false);message('ETAPPE '+(n+1)+'/4',LEGS[n].title+'  +'+LEGS[n].time+' s',2.2);}updateCamera(dt);return;}
  const I=inp();
  if(S.mode==='intro'){const prev=Math.ceil(S.introT-0.4);S.introT-=dt;const now=Math.ceil(S.introT-0.4);if(now!==prev&&now>0&&now<=3)sfx('count');
    if(S.introT<=0){S.mode='drive';sfx('go');message('LOS!','',0.7,'#38f0b6');}
    updateTraffic(dt);updateCamera(dt);updateAudio();return;}
  // timers
  S.time-=dt;S.clock+=dt;S.legT+=dt;
  const sec=Math.ceil(S.time);if(S.time<10&&sec!==S.tick){S.tick=sec;sfx('tick');}
  if(S.time<=0){S.time=0;fail();return;}
  if(S.pagerQ.length&&S.legT>=S.pagerQ[0].t){S.pager={text:S.pagerQ.shift().text,t:0};sfx('pickup');}
  if(S.pager){S.pager.t+=dt;if(S.pager.t>5.5)S.pager=null;}
  S.shake*=Math.exp(-dt*8);S.faceHit=Math.max(0,S.faceHit-dt);S.flash=Math.max(0,S.flash-dt);
  if(S.mode==='drive'){
    const hit=updateCar(player,dt,I);
    if(hit&&hit.imp>170)crashFx(player.x-hit.nx*28,player.y-hit.ny*28,hit.imp);
    for(const c of traffic){if(Math.abs(c.x-player.x)>150||Math.abs(c.y-player.y)>150)continue;
      const h=vehicleHit(player,c,c.m.truck);
      if(h&&h.imp>60){if(h.imp>130&&c.stun<=0){c.stun=1.1;c.spin=(R()-.5)*6;const k=c.m.truck?.2:.6;c.kx=-h.nx*h.imp*k;c.ky=-h.ny*h.imp*k;}if(h.imp>170)crashFx(h.x,h.y,h.imp);}}
    // pickups
    for(const p of world.pickups)if(p.on&&hyp(p.x-player.x,p.y-player.y)<48){p.on=false;S.time+=2;sfx('pickup');message('+2 SEK','',0.7,'#38f0b6');}
    // blitzer
    S.blitzWarn=0;
    for(const b of world.blitzers){const d=hyp(b.x-player.x,b.y-player.y);if(!b.done&&d<900)S.blitzWarn=1;
      if(!b.done&&d<210){const kmh=Math.abs(player.vf)*0.22;if(kmh>120){b.done=true;S.flash=.35;S.flashes++;sfx('flash');message('GEBLITZT!',(kmh|0)+' km/h · Polizei kommt!',1.6,'#ff3b5c');spawnPolice();}}}
    // checkpoints
    const cps=world.cps;for(let j=S.cpi;j<cps.length;j++)if(hyp(cps[j].x-player.x,cps[j].y-player.y)<5*T){S.cpi=j+1;}
    const g=world.goal;if(hyp(g.x-player.x,g.y-player.y)<g.r)onGoal();
    updatePolice(dt);
  }else if(S.mode==='foot'){
    if(!S.nextCar){const f=world.spec.foot;S.nextCar=makeCar(f.car,f.x*T,f.y*T,f.a);}
    updateWalker(dt,I);
    player.vx*=.9;player.vy*=.9;
  }
  // zones
  const tgt=walker||player;let zn=world.spec.zoneDefault;for(const z of world.zones)if(tgt.x>=z.x0&&tgt.x<z.x1&&tgt.y>=z.y0&&tgt.y<z.y1){zn=z.name;break;}
  if(zn!==S.zone){S.zone=zn;S.zoneT=0;}S.zoneT+=dt;
  updateTraffic(dt);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.k==='smoke'){p.s+=dt*20;}}
  parts=parts.filter(p=>p.life>0);
  updateCamera(dt);updateAudio();
}
function spawnPolice(){
  if(S.police)return;const fx=Math.cos(player.a),fy=Math.sin(player.a);
  let x=player.x-fx*850,y=player.y-fy*850;
  // pull spawn back onto a road if possible
  let best=null,bd=1e9;for(const rd of world.roads){if(rd.kind==='street')continue;for(let s=0;s<rd.len;s+=60){const p=pointAt(rd,s),d=Math.abs(hyp(p.x-player.x,p.y-player.y)-850)+((p.x-player.x)*fx+(p.y-player.y)*fy>0?2000:0);if(d<bd){bd=d;best=p;}}}
  if(best){x=best.x;y=best.y;}
  const p=makeCar('police',x,y,Math.atan2(player.y-y,player.x-x));p.t=0;S.police=p;
  S.pager={text:'POLIZEI: Halten Sie sofort an! Wir sind direkt hinter Ihnen.',t:0};
}
function updatePolice(dt){
  const p=S.police;if(!p)return;p.t+=dt;
  const tx=player.x+player.vx*0.45,ty=player.y+player.vy*0.45;const want=Math.atan2(ty-p.y,tx-p.x);const d=angDiff(p.a,want);
  const speed=hyp(p.vx,p.vy);
  if(speed<40)p.stuck+=dt;else p.stuck=Math.max(0,p.stuck-dt);
  if(p.stuck>1.2){p.rev=0.9;p.stuck=0;}
  let I;
  if(p.rev>0){p.rev-=dt;I={up:false,down:true,left:d>0,right:d<0};}
  else I={up:true,down:Math.abs(d)>1.5&&speed>260,left:d<-0.06,right:d>0.06};
  const hit=updateCar(p,dt,I);
  const h=vehicleHit(player,p,false);
  if(h){p.vx*=.5;p.vy*=.5;if(h.imp>170)crashFx(h.x,h.y,h.imp);
    if(Math.abs(player.vf)<230){S.time=Math.max(0.1,S.time-6);message('STRAFZETTEL!','-6 Sekunden',1.6,'#ff3b5c');S.police=null;sfx('fail');return;}}
  for(const c of traffic){if(Math.abs(c.x-p.x)<120&&Math.abs(c.y-p.y)<120){const hh=vehicleHit(p,c,c.m.truck);if(hh&&hh.imp>130&&c.stun<=0){c.stun=1;c.spin=(R()-.5)*5;c.kx=-hh.nx*hh.imp*.5;c.ky=-hh.ny*hh.imp*.5;}}}
  if(p.t>20||hyp(p.x-player.x,p.y-player.y)>2600){S.police=null;message('ABGEHÄNGT!','',1.2,'#38f0b6');}
}
function updateCamera(dt){
  const t=walker||player;const vx=t.vx||0,vy=t.vy||0;
  const tx=t.x+vx*0.38,ty=t.y+vy*0.38;
  const k=Math.min(1,dt*4.5);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
  const sp=hyp(vx,vy);const zt=walker?baseZoom()*1.25:baseZoom()*(1-0.33*Math.min(1,sp/800));
  cam.z+=(zt-cam.z)*Math.min(1,dt*1.6);
}

// ---------- render ----------
let grassPat=null;
function makePattern(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.fillStyle='#4e7f38';g.fillRect(0,0,128,128);
  const r=rng(7);for(let i=0;i<500;i++){g.fillStyle=r()<.5?'rgba(30,60,20,.18)':'rgba(140,180,90,.14)';g.fillRect(r()*128,r()*128,2+r()*3,2+r()*3);}grassPat=ctx.createPattern(c,'repeat');}
makePattern();
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function strokePts(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();}
function drawCar(x,y,a,m,o){
  o=o||{};ctx.save();ctx.translate(x,y);ctx.rotate(a);const L=m.len,Wd=m.wid;
  ctx.fillStyle='rgba(0,0,0,.33)';rr(-L/2+4,-Wd/2+5,L,Wd,7);ctx.fill();

    ctx.fillStyle=m.color;rr(-L/2,-Wd/2,L-26,Wd,3);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle=m.roof;ctx.fillRect(-L/2+6,-Wd/2+4,L-40,5);ctx.fillRect(-L/2+6,Wd/2-9,L-40,5);
    ctx.fillStyle=m.roof;rr(L/2-24,-Wd/2+1,24,Wd-2,5);ctx.fill();ctx.stroke();
    ctx.fillStyle='#1d2733';ctx.fillRect(L/2-9,-Wd/2+4,6,Wd-8);
    ctx.restore();return;
  }
  ctx.fillStyle=m.color;rr(-L/2,-Wd/2,L,Wd,7);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=2;ctx.stroke();
  if(m.stripe){ctx.fillStyle='rgba(20,20,20,.85)';ctx.fillRect(-L/2,-3,L,6);}
  if(m.police){ctx.fillStyle='#1f4fa8';ctx.fillRect(-L/2+4,-Wd/2,L-8,5);ctx.fillRect(-L/2+4,Wd/2-5,L-8,5);}
  ctx.fillStyle='#1d2733';rr(L*0.12,-Wd/2+4,L*0.17,Wd-8,3);ctx.fill();rr(-L*0.42,-Wd/2+5,L*0.12,Wd-10,3);ctx.fill();

  if(o.brake){ctx.fillStyle='rgba(255,40,40,.25)';ctx.beginPath();ctx.arc(-L/2,-Wd/2+6,9,0,7);ctx.arc(-L/2,Wd/2-6,9,0,7);ctx.fill();}
  if(m.taxi&&!o.face){ctx.fillStyle='#f7d21e';ctx.fillRect(-8,-8,14,16);ctx.fillStyle='#111';ctx.font='bold 7px sans-serif';ctx.save();ctx.rotate(Math.PI/2);ctx.textAlign='center';ctx.fillText('TAXI',0,2);ctx.restore();}
  if(m.police){const on=(Math.floor(performance.now()/160)%2)===0;ctx.fillStyle=on?'#3a7bff':'#173a80';ctx.fillRect(-6,-Wd/2+5,8,Wd/2-5);ctx.fillStyle=on?'#173a80':'#3a7bff';ctx.fillRect(-6,0,8,Wd/2-5);
    ctx.fillStyle=on?'rgba(60,120,255,.28)':'rgba(60,120,255,.12)';ctx.beginPath();ctx.arc(0,0,40,0,7);ctx.fill();}
  if(m.face&&o.face){const rad=Wd*0.62;ctx.save();ctx.translate(-L*0.06,0);ctx.beginPath();ctx.arc(0,0,rad+2.5,0,7);ctx.fillStyle='#fff';ctx.fill();
    ctx.beginPath();ctx.arc(0,0,rad,0,7);ctx.clip();ctx.rotate(Math.PI/2);if(FACE.complete)ctx.drawImage(FACE,-rad,-rad,rad*2,rad*2);ctx.restore();
    if(m.taxi){ctx.fillStyle='#f7d21e';ctx.fillRect(L*0.2,-7,9,14);}}

function drawWalker(w){

  ctx.fillStyle='#e8c4a8';ctx.beginPath();ctx.arc(6-sw*.4,-17,4,0,7);ctx.arc(6+sw*.4,17,4,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(2,0,17.5,0,7);ctx.fillStyle='#fff';ctx.fill();
  ctx.beginPath();ctx.arc(2,0,15.5,0,7);ctx.clip();ctx.translate(2,0);ctx.rotate(Math.PI/2);if(FACE.complete)ctx.drawImage(FACE,-15.5,-15.5,31,31);

function drawBuilding(b){
  const k=b.h*LEAN,cx=cam.x,cy=cam.y;
  const c=[[b.x0,b.y0],[b.x1,b.y0],[b.x1,b.y1],[b.x0,b.y1]];

    if((cx-mx)*N[i][0]+(cy-my)*N[i][1]>0){ctx.fillStyle=b.wall;ctx.beginPath();ctx.moveTo(c[i][0],c[i][1]);ctx.lineTo(c[j][0],c[j][1]);ctx.lineTo(r[j][0],r[j][1]);ctx.lineTo(r[i][0],r[i][1]);ctx.closePath();ctx.fill();
      ctx.fillStyle=`rgba(0,0,0,${1-shade[i]})`;ctx.fill();
      if(b.h>1.6&&b.kind!=='dom'){ // windows as floor bands
        ctx.strokeStyle='rgba(255,230,160,.18)';ctx.lineWidth=2;const fl=Math.floor(b.h);
        for(let f=1;f<=fl;f++){const t=(f-.5)/b.h;ctx.beginPath();ctx.moveTo(c[i][0]+(r[i][0]-c[i][0])*t,c[i][1]+(r[i][1]-c[i][1])*t);ctx.lineTo(c[j][0]+(r[j][0]-c[j][0])*t,c[j][1]+(r[j][1]-c[j][1])*t);ctx.stroke();}}}}
  const rw=r[2][0]-r[0][0],rh=r[2][1]-r[0][1],s=1+k;
  ctx.fillStyle=b.roof;ctx.fillRect(r[0][0],r[0][1],rw,rh);
  ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=3*s;ctx.strokeRect(r[0][0]+1.5*s,r[0][1]+1.5*s,rw-3*s,rh-3*s);
  ctx.fillStyle='rgba(0,0,0,.22)';for(const d of b.det)ctx.fillRect(r[0][0]+d[0]*s,r[0][1]+d[1]*s,d[2]*s,d[3]*s);
  if(b.kind==='dom'){ctx.fillStyle='#57524e';const tw=rw*.22;ctx.fillRect(r[0][0]+rw*.12,r[0][1]+rh*.1,tw,tw);ctx.fillRect(r[0][0]+rw*.66,r[0][1]+rh*.1,tw,tw);
    ctx.strokeStyle='#3f3b38';ctx.lineWidth=4*s;ctx.beginPath();ctx.moveTo(r[0][0]+rw*.5,r[0][1]+rh*.2);ctx.lineTo(r[0][0]+rw*.5,r[0][1]+rh*.9);ctx.stroke();}
  if(b.kind==='shisha'){const t=performance.now()/300;ctx.save();ctx.shadowColor='#ff3bd0';ctx.shadowBlur=24;ctx.strokeStyle=`rgba(255,80,220,${.75+.25*Math.sin(t*3)})`;ctx.lineWidth=5*s;ctx.strokeRect(r[0][0]+8*s,r[0][1]+8*s,rw-16*s,rh-16*s);ctx.restore();}
  if(b.label){ctx.save();ctx.fillStyle=b.kind==='shisha'?'#ffe1f7':'rgba(255,255,255,.9)';ctx.font=`${Math.min(rh*.36,rw/(b.label.length*0.72))}px Bungee, Impact, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    if(b.kind==='shisha'){ctx.shadowColor='#ff3bd0';ctx.shadowBlur=16;}ctx.fillText(b.label,r[0][0]+rw/2,r[0][1]+rh/2+2);ctx.restore();}
}
function drawTree(t){const k=t.h*LEAN*.9,x=t.x+(t.x-cam.x)*k,y=t.y+(t.y-cam.y)*k,r=t.cr*(1+k);

function render(){

  const z=cam.z;let sx=0,sy=0;if(S.shake>.3){sx=(Math.random()-.5)*S.shake;sy=(Math.random()-.5)*S.shake;}
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.setTransform(DPR*z,0,0,DPR*z,DPR*(W/2-cam.x*z+sx),DPR*(H/2-cam.y*z+sy));
  const vx0=cam.x-W/2/z-60,vx1=cam.x+W/2/z+60,vy0=cam.y-H/2/z-60,vy1=cam.y+H/2/z+60;

    ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=4;ctx.beginPath();if(f.v){for(let x=f.x0+10;x<f.x1;x+=18){ctx.moveTo(x,f.y0);ctx.lineTo(x,f.y1);}}else{for(let y=f.y0+10;y<f.y1;y+=18){ctx.moveTo(f.x0,y);ctx.lineTo(f.x1,y);}}ctx.stroke();}
  ctx.lineJoin='round';ctx.lineCap='round';
  for(const rv of w.rivers){ctx.strokeStyle='#6b7d4a';ctx.lineWidth=rv.w+26;strokePts(rv.pts);ctx.strokeStyle='#2c5f80';ctx.lineWidth=rv.w;strokePts(rv.pts);
    ctx.strokeStyle='rgba(120,190,230,.35)';ctx.lineWidth=rv.w*.45;ctx.setLineDash([40,60]);ctx.lineDashOffset=-performance.now()/40;strokePts(rv.pts);ctx.setLineDash([]);}
  for(const b of w.blocks){if(!vis(b.x0,b.y0,b.x1,b.y1))continue;ctx.fillStyle=b.park?'#5e9446':'#a8a497';ctx.fillRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);

      if(s.label){ctx.save();ctx.fillStyle=s.taxi?'rgba(247,210,30,.85)':'rgba(255,255,255,.75)';ctx.font='54px Bungee, Impact, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s.label,(s.x0+s.x1)/2,(s.y0+s.y1)/2);ctx.restore();}}

      ctx.fillStyle='#fff';for(let i=0;i<6;i++){ctx.fillRect(s.x0+20,s.y0+30+i*56,70,24);ctx.fillRect(s.x1-90,s.y0+30+i*56,70,24);}}
    if(s.type==='station'){ctx.fillStyle='#6c655c';ctx.fillRect(0,s.y0-T*1.3,w.W,T*.9);ctx.strokeStyle='#b8b2a6';ctx.lineWidth=4;for(const o of[.25,.65]){ctx.beginPath();ctx.moveTo(0,s.y0-T*1.3+T*.9*o);ctx.lineTo(w.W,s.y0-T*1.3+T*.9*o);ctx.stroke();}
      ctx.fillStyle='#a8a497';ctx.fillRect(s.x0-20,s.y1,s.x1-s.x0+40,24);}
  }

  const rv=w.roads.filter(r=>vis(r.x0,r.y0,r.x1,r.y1));
  for(const r of rv){ctx.strokeStyle=r.kind==='hw'?'#77776f':r.kind==='road'?'#7f7b6c':'#8f8b80';ctx.lineWidth=r.w+(r.kind==='street'?12:14);strokePts(r.pts);}
  for(const r of rv){ctx.strokeStyle=r.kind==='hw'?'#36373b':'#3d3e42';ctx.lineWidth=r.w;strokePts(r.pts);}
  for(const r of rv){
    if(r.kind==='hw'){ctx.strokeStyle='#8a8a80';ctx.lineWidth=12;strokePts(r.pts);ctx.strokeStyle='#d6d6cc';ctx.lineWidth=3;strokePts(r.pts);
      ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=3;for(const e of r.edge)strokePts(e);ctx.setLineDash([30,40]);for(const d of r.dash)strokePts(d);ctx.setLineDash([]);}
    else if(r.kind==='road'){ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;for(const e of r.edge)strokePts(e);ctx.setLineDash([26,30]);strokePts(r.pts);ctx.setLineDash([]);}
    else{ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2.5;ctx.setLineDash([18,26]);strokePts(r.pts);ctx.setLineDash([]);}
  }
  // skids
  ctx.strokeStyle='rgba(15,15,15,.35)';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();for(const s of skids){if(s[0]<vx0||s[0]>vx1||s[1]<vy0||s[1]>vy1)continue;ctx.moveTo(s[0],s[1]);ctx.lineTo(s[2],s[3]);}ctx.stroke();
  const now=performance.now()/1000;
  // pickups
  for(const p of w.pickups){if(!p.on||!vis(p.x-30,p.y-30,p.x+30,p.y+30))continue;const s=1+.12*Math.sin(now*6);ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);
    ctx.fillStyle='#38f0b6';ctx.beginPath();ctx.arc(0,0,20,0,7);ctx.fill();ctx.strokeStyle='#0d0f14';ctx.lineWidth=4;ctx.stroke();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-12);ctx.moveTo(0,0);ctx.lineTo(9,4);ctx.stroke();ctx.restore();}
  // blitzer
  for(const b of w.blitzers){if(!vis(b.x-40,b.y-40,b.x+40,b.y+40))continue;ctx.fillStyle='#2b2d33';ctx.fillRect(b.x-10,b.y-22,20,44);ctx.fillStyle=b.done?'#555':'#f08c1a';ctx.fillRect(b.x-7,b.y-18,14,10);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y+10,14,0,7);ctx.fill();ctx.strokeStyle='#d21f2b';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#111';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('120',b.x,b.y+11);}
  // goal marker
  const g=w.goal;if(S.mode!=='foot'&&S.mode!=='title'&&vis(g.x-g.r,g.y-g.r,g.x+g.r,g.y+g.r)){const pr=g.r*(.75+.12*Math.sin(now*5));ctx.strokeStyle='rgba(247,210,30,.9)';ctx.lineWidth=8;ctx.setLineDash([22,16]);ctx.lineDashOffset=-now*60;ctx.beginPath();ctx.arc(g.x,g.y,pr,0,7);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(247,210,30,.18)';ctx.beginPath();ctx.arc(g.x,g.y,pr,0,7);ctx.fill();}
  // vehicles
  for(const p of w.parked)if(vis(p.x-50,p.y-50,p.x+50,p.y+50))drawCar(p.x,p.y,p.a,p.m);
  for(const c of traffic)if(vis(c.x-70,c.y-70,c.x+70,c.y+70))drawCar(c.x,c.y,c.a,c.m,{brake:c.v<c.vmax*.5});
  if(S.nextCar)drawCar(S.nextCar.x,S.nextCar.y,S.nextCar.a,S.nextCar.m,{glow:true});
  if(S.police)drawCar(S.police.x,S.police.y,S.police.a,S.police.m,{});
  if(S.mode!=='title')drawCar(player.x,player.y,player.a,player.m,{brake:player.brake,face:!walker});
  if(walker)drawWalker(walker);
  for(const p of parts){if(p.k==='smoke'){ctx.fillStyle=p.c;ctx.globalAlpha=p.life/p.max*.5;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();}else{ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,p.s+1,p.s+1);}}ctx.globalAlpha=1;
  // 3D layer: trees + buildings sorted far->near
  const pad=320,list=[];
  for(const b of w.buildings)if(b.x1>vx0-pad&&b.x0<vx1+pad&&b.y1>vy0-pad&&b.y0<vy1+pad){const mx=(b.x0+b.x1)/2,my=(b.y0+b.y1)/2;list.push([hyp(mx-cam.x,my-cam.y),b]);}
  for(const t of w.trees)if(t.x>vx0-80&&t.x<vx1+80&&t.y>vy0-80&&t.y<vy1+80)list.push([hyp(t.x-cam.x,t.y-cam.y),t]);

  drawArrow();

function worldToScreen(x,y){return [(x-cam.x)*cam.z+W/2,(y-cam.y)*cam.z+H/2];}
function drawArrow(){

  const [px,py]=worldToScreen(t.x,t.y);const a=Math.atan2(tg.y-t.y,tg.x-t.x);const d=hyp(tg.x-t.x,tg.y-t.y);

  ctx.save();ctx.translate(px+Math.cos(a)*(rad+bob),py+Math.sin(a)*(rad+bob));ctx.rotate(a);
  ctx.fillStyle='#f7d21e';ctx.strokeStyle='#0d0f14';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-10,-14);ctx.lineTo(-4,0);ctx.lineTo(-10,14);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();

  ctx.lineWidth=4;ctx.strokeStyle='#0d0f14';ctx.strokeText(txt,lx,ly);ctx.fillStyle='#fff';ctx.fillText(txt,lx,ly);

function outlined(txt,x,y,fill,lw){ctx.lineJoin='round';ctx.lineWidth=lw||6;ctx.strokeStyle='#0d0f14';ctx.strokeText(txt,x,y);ctx.fillStyle=fill;ctx.fillText(txt,x,y);}

function drawHUD(){
  const top=SAFE.t+12,left=SAFE.l+12,right=W-SAFE.r-12;const now=performance.now()/1000;
  // face
  const stress=clamp(1-S.time/18,0,1);const fs=W<500?62:84;const jit=stress*4+S.faceHit*10;
  ctx.save();ctx.translate(left+fs/2+(Math.random()-.5)*jit,top+fs/2+(Math.random()-.5)*jit);ctx.rotate((Math.random()-.5)*jit*0.03);
  const sc=1+stress*.08*Math.sin(now*14);ctx.scale(sc,sc);
  ctx.beginPath();ctx.arc(0,0,fs/2+4,0,7);ctx.fillStyle=S.time<10?'#ff3b5c':'#f7d21e';ctx.fill();ctx.beginPath();ctx.arc(0,0,fs/2,0,7);ctx.save();ctx.clip();
  if(FACE.complete)ctx.drawImage(FACE,-fs/2,-fs/2,fs,fs);if(S.faceHit>0){ctx.fillStyle=`rgba(255,40,60,${S.faceHit})`;ctx.fillRect(-fs/2,-fs/2,fs,fs);}ctx.restore();ctx.restore();
  ctx.textAlign='left';ctx.textBaseline='top';ctx.font='800 14px "Barlow Condensed", Arial Narrow, sans-serif';
  outlined('ETAPPE '+(S.leg+1)+'/4',left,top+fs+10,'#fff',4);

  ctx.textAlign='center';ctx.font=`${tsz}px Bungee, Impact, sans-serif`;
  outlined(fmtT(S.time),W/2,top-2,low?'#ff3b5c':'#f7d21e',8);
  ctx.font='800 15px "Barlow Condensed", Arial Narrow, sans-serif';
  outlined('ZIEL: '+world.spec.dest,W/2,top+tsz+2,'#fff',4);
  // minimap
  const ms=W<500?96:132,mx=right-ms,my=top;
  ctx.save();ctx.beginPath();ctx.rect(mx,my,ms,ms);ctx.fillStyle='#0d0f14';ctx.fill();ctx.clip();
  const t=walker||player,span=110;
  ctx.imageSmoothingEnabled=false;ctx.drawImage(world.mini,t.x/G-span/2,t.y/G-span/2,span,span,mx,my,ms,ms);ctx.imageSmoothingEnabled=true;
  const ks=ms/span/G,cxm=mx+ms/2,cym=my+ms/2;
  const g=S.mode==='foot'&&S.nextCar?S.nextCar:world.goal;let gx=cxm+(g.x-t.x)*ks,gy=cym+(g.y-t.y)*ks;gx=clamp(gx,mx+6,mx+ms-6);gy=clamp(gy,my+6,my+ms-6);
  ctx.fillStyle='#f7d21e';ctx.strokeStyle='#0d0f14';ctx.lineWidth=2;ctx.beginPath();ctx.arc(gx,gy,5+Math.sin(now*8),0,7);ctx.fill();ctx.stroke();
  if(S.police){ctx.fillStyle=(Math.floor(now*6)%2)?'#3a7bff':'#ff3b5c';ctx.beginPath();ctx.arc(cxm+(S.police.x-t.x)*ks,cym+(S.police.y-t.y)*ks,4,0,7);ctx.fill();}
  ctx.translate(cxm,cym);ctx.rotate(walker?walker.a:player.a);ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(-5,-5);ctx.lineTo(-5,5);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();ctx.strokeStyle='#f7d21e';ctx.lineWidth=3;ctx.strokeRect(mx,my,ms,ms);
  // zone name

  // pager
  if(S.pager){const pw=Math.min(W-24-SAFE.l-SAFE.r,420),px=W/2-pw/2,py=W<500?top+ms+34:top+96;const shown=S.pager.text.slice(0,Math.floor(S.pager.t*55));
    ctx.font='600 17px "Barlow Condensed", Arial Narrow, sans-serif';const lines=wrap(shown,pw-24);const ph=Math.max(1,wrap(S.pager.text,pw-24).length)*20+18;
    ctx.fillStyle='#1b1f16';rr(px-4,py-4,pw+8,ph+8,8);ctx.fill();ctx.fillStyle='#b9d66e';rr(px,py,pw,ph,5);ctx.fill();
    ctx.fillStyle='#1b2610';ctx.textAlign='left';ctx.textBaseline='top';lines.forEach((l,i)=>ctx.fillText(l,px+12,py+9+i*20));}
  // speed
  if(!walker&&S.mode!=='foot'){const kmh=Math.abs(player.vf||0)*0.22|0;ctx.textAlign=TOUCH?'center':'right';ctx.textBaseline='alphabetic';
    const sxp=TOUCH?W/2:right,syp=TOUCH?H-SAFE.b-120:H-SAFE.b-18;ctx.font=`${W<500?28:36}px Bungee, Impact, sans-serif`;outlined(String(kmh),sxp-(TOUCH?0:44),syp,kmh>120&&S.blitzWarn?'#ff3b5c':'#fff',6);
    ctx.font='800 15px "Barlow Condensed", Arial Narrow, sans-serif';ctx.textAlign='left';outlined('km/h',TOUCH?sxp+(W<500?30:38):right-38,syp,'#fff',4);}
  if(S.blitzWarn&&S.mode==='drive'&&(Math.floor(now*3)%2)){ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${W<500?18:24}px Bungee, Impact, sans-serif`;outlined('BLITZER VORAUS · 120',W/2,H*0.68,'#ff8b2b',6);}
  if(S.police){ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${W<500?16:20}px Bungee, Impact, sans-serif`;outlined('POLIZEI '+Math.max(0,20-S.police.t).toFixed(0)+' s',W/2,H*0.74,(Math.floor(now*5)%2)?'#3a7bff':'#ff3b5c',5);}
  // countdown
  if(S.mode==='intro'){const n=Math.ceil(S.introT-0.4);if(n>0&&n<=3){const f=(S.introT-0.4)%1;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${(W<500?90:130)*(0.8+f*0.4)}px Bungee, Impact, sans-serif`;outlined(String(n),W/2,H*0.62,'#f7d21e',10);}}
  // big message
  if(S.msg){const m=S.msg,p=Math.min(1,m.t/0.15),a=m.t>m.dur-0.3?Math.max(0,(m.dur-m.t)/0.3):1;ctx.globalAlpha=a;
    const sz=Math.min(W<500?44:72,(W-40)/Math.max(4,m.text.length*0.85));ctx.save();ctx.translate(W/2,H*0.4);ctx.scale(0.6+0.4*p,0.6+0.4*p);ctx.rotate(-0.04);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`${sz}px Bungee, Impact, sans-serif`;outlined(m.text,0,0,m.color,10);
    if(m.sub){ctx.font=`800 ${W<500?20:26}px "Barlow Condensed", Arial Narrow, sans-serif`;outlined(m.sub.toUpperCase(),0,sz*0.75,'#fff',6);}
    ctx.restore();ctx.globalAlpha=1;}
}

// ---------- loop ----------
let last=performance.now();
function frame(ts){const dt=Math.min(0.05,(ts-last)/1000);last=ts;try{update(dt);render();}catch(e){console.error(e);}requestAnimationFrame(frame);}
function b64(s){return Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));}
async function openLock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(LOCK.s),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(LOCK.i)},key,b64(LOCK.d));
  FACE_SRC=URL.createObjectURL(new Blob([buf],{type:'image/jpeg'}));FACE.src=FACE_SRC;
  await new Promise(r=>{if(FACE.complete)r();else{FACE.onload=r;FACE.onerror=r;}});
}
function unlock(){
  let saved=null;try{saved=localStorage.getItem('shishaexpress-pw');}catch(e){}
  const ask=(err)=>{showOverlay(`<form class="card" id="lockf"><h1>SHISHA EXPRESS</h1><p class="lead">Nur für Eingeweihte. Passwort eingeben:</p>
    <input id="pw" type="password" autocomplete="current-password" aria-label="Passwort" style="font:600 22px var(--body);padding:10px 14px;border-radius:6px;border:3px solid var(--hud);background:var(--panel);color:var(--paper);width:min(260px,100%);text-align:center">
    <p class="keys" id="pwmsg" style="color:var(--hot);min-height:1.3em">${err||''}</p><button class="btn" type="submit">Öffnen</button></form>`);
    const f=document.getElementById('lockf'),i=document.getElementById('pw');i.focus();
    f.addEventListener('submit',async ev=>{ev.preventDefault();const pw=i.value;document.getElementById('pwmsg').textContent='Prüfe …';
      try{await openLock(pw);try{localStorage.setItem('shishaexpress-pw',pw);}catch(e){}title();}catch(e){ask('Falsches Passwort.');}});};
  if(saved)openLock(saved).then(title,()=>ask(''));else ask('');
}
unlock();
requestAnimationFrame(frame);
window.__shisha={S,get player(){return player;},get world(){return world;},startLeg,LEGS,T};
})();
